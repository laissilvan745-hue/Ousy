<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
/* =====================================================================
   1. DESIGN TOKENS
   Toda a identidade visual está centralizada aqui. Para aplicar o
   Design System oficial da Ousy, substitua apenas os valores abaixo.
   ===================================================================== */
:root {
  /* Marca */
  --brand-ink: #15191f;          /* cor institucional escura */
  --brand-accent: #a8835a;       /* acento (bronze) */
  --brand-accent-strong: #8c6a43;
  --brand-accent-soft: #f3ece3;

  /* Superfícies e texto */
  --color-bg: #f6f5f2;
  --color-surface: #ffffff;
  --color-surface-2: #faf9f7;
  --color-surface-inverse: #15191f;
  --color-border: #e5e2dc;
  --color-border-strong: #cfcac1;
  --color-text: #1b1f25;
  --color-text-muted: #5f646d;
  --color-text-subtle: #8a8f98;
  --color-text-inverse: #f4f2ee;

  /* Estados semânticos */
  --color-positive: #2f7d5b;
  --color-positive-soft: #e5f2ec;
  --color-negative: #b4443b;
  --color-negative-soft: #f8e7e5;
  --color-warning: #a86b12;
  --color-warning-soft: #fbf0dc;
  --color-info: #2f5f9e;
  --color-info-soft: #e6eef8;
  --color-neutral-soft: #eeece8;

  /* Proveniência dos dados */
  --prov-briefing: #a86b12;
  --prov-oficial: #2f7d5b;
  --prov-terceiros: #2f5f9e;
  --prov-hipotese: #7a4fa0;
  --prov-interno: #5f646d;

  /* Paleta de gráficos (categórica) */
  --chart-1: #15191f;
  --chart-2: #a8835a;
  --chart-3: #2f5f9e;
  --chart-4: #2f7d5b;
  --chart-5: #b4443b;
  --chart-6: #7a4fa0;
  --chart-7: #5f8f9e;
  --chart-8: #c9a77c;
  --chart-grid: #ebe8e2;

  /* Radar */
  --radar-bg: #11151a;
  --radar-ring: rgba(200, 175, 140, 0.18);
  --radar-sweep: rgba(200, 160, 110, 0.55);
  --radar-text: #cbbfae;

  /* Tipografia */
  --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --fs-xs: 0.75rem;
  --fs-sm: 0.8125rem;
  --fs-md: 0.9375rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.375rem;
  --fs-2xl: 1.75rem;
  --fs-3xl: 2.375rem;
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;
  --fw-bold: 700;
  --lh-tight: 1.2;
  --lh-normal: 1.5;
  --tracking-caps: 0.08em;

  /* Espaçamento (escala de 4px) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* Bordas, raios e sombras */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;
  --border-width: 1px;
  --shadow-sm: 0 1px 2px rgba(20, 22, 26, 0.06);
  --shadow-md: 0 4px 16px rgba(20, 22, 26, 0.08);
  --shadow-lg: 0 16px 48px rgba(20, 22, 26, 0.18);

  /* Layout */
  --sidebar-width: 256px;
  --topbar-height: 60px;
  --content-max: 1440px;

  /* Movimento */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --duration-fast: 120ms;
  --duration-base: 200ms;
}

/* Tema escuro: os mesmos tokens com outros valores */
:root[data-theme="dark"] {
  --color-bg: #0f1216;
  --color-surface: #161a20;
  --color-surface-2: #1b2027;
  --color-surface-inverse: #f4f2ee;
  --color-border: #2a3039;
  --color-border-strong: #3a414c;
  --color-text: #eceae6;
  --color-text-muted: #a7acb4;
  --color-text-subtle: #7d838c;
  --color-text-inverse: #15191f;
  --brand-accent-soft: #2a241d;
  --color-positive-soft: #16291f;
  --color-negative-soft: #2f1a18;
  --color-warning-soft: #2f2414;
  --color-info-soft: #172334;
  --color-neutral-soft: #222830;
  --chart-1: #e6e2db;
  --chart-grid: #262c34;
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-bg: #0f1216;
    --color-surface: #161a20;
    --color-surface-2: #1b2027;
    --color-surface-inverse: #f4f2ee;
    --color-border: #2a3039;
    --color-border-strong: #3a414c;
    --color-text: #eceae6;
    --color-text-muted: #a7acb4;
    --color-text-subtle: #7d838c;
    --color-text-inverse: #15191f;
    --brand-accent-soft: #2a241d;
    --color-positive-soft: #16291f;
    --color-negative-soft: #2f1a18;
    --color-warning-soft: #2f2414;
    --color-info-soft: #172334;
    --color-neutral-soft: #222830;
    --chart-1: #e6e2db;
    --chart-grid: #262c34;
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
  }
}

/* =====================================================================
   2. BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; line-height: var(--lh-tight); font-weight: var(--fw-semibold); }
p { margin: 0; }
a { color: var(--brand-accent-strong); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--color-text-muted); }
.subtle { color: var(--color-text-subtle); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.mono { font-family: var(--font-mono); font-size: var(--fs-sm); }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.hidden { display: none !important; }

/* =====================================================================
   3. LAYOUT (sidebar + topbar + conteúdo)
   ===================================================================== */
.app { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--brand-ink); color: var(--color-text-inverse);
  display: flex; flex-direction: column; z-index: 40;
}
:root[data-theme="dark"] .sidebar { background: #0b0d10; color: #eceae6; }
.brand { padding: var(--space-6) var(--space-5) var(--space-5); border-bottom: 1px solid rgba(255,255,255,0.08); }
.brand-name { font-family: var(--font-display); font-size: var(--fs-xl); letter-spacing: 0.02em; color: #f4f2ee; }
.brand-name b { color: var(--brand-accent); font-weight: 600; }
.brand-tag { font-size: var(--fs-xs); color: #a19a90; letter-spacing: var(--tracking-caps); text-transform: uppercase; margin-top: var(--space-1); }
.nav { padding: var(--space-3) var(--space-3) var(--space-6); display: flex; flex-direction: column; gap: 2px; }
.nav-section { font-size: 0.6875rem; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: #7f7a72; padding: var(--space-4) var(--space-3) var(--space-2); }
.nav a {
  display: flex; align-items: center; gap: var(--space-3);
  padding: 9px var(--space-3); border-radius: var(--radius-md);
  color: #cfcac2; font-size: var(--fs-sm); font-weight: var(--fw-medium);
  transition: background var(--duration-fast), color var(--duration-fast);
}
.nav a:hover { background: rgba(255,255,255,0.06); color: #fff; text-decoration: none; }
.nav a.active { background: rgba(168,131,90,0.18); color: #fff; }
.nav a.active .nav-ico { color: var(--brand-accent); }
.nav-ico { width: 18px; height: 18px; flex: none; color: #8f8a82; }
.nav-num { margin-left: auto; font-size: 0.6875rem; color: #8f8a82; }
.sidebar-foot { margin-top: auto; padding: var(--space-4) var(--space-5); font-size: var(--fs-xs); color: #8f8a82; border-top: 1px solid rgba(255,255,255,0.08); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30; height: var(--topbar-height);
  display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-6);
  background: color-mix(in srgb, var(--color-bg) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--color-border);
}
.topbar .menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 520px; }
.search input {
  width: 100%; height: 38px; padding: 0 var(--space-3) 0 36px;
  border: 1px solid var(--color-border); border-radius: var(--radius-md);
  background: var(--color-surface);
}
.search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; color: var(--color-text-subtle); }
.search-results {
  position: absolute; top: 44px; left: 0; right: 0; max-height: 420px; overflow: auto;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-lg); padding: var(--space-2);
}
.search-results a { display: block; padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); color: var(--color-text); }
.search-results a:hover, .search-results a.kbd { background: var(--color-neutral-soft); text-decoration: none; }
.search-results .grp { font-size: var(--fs-xs); color: var(--color-text-subtle); text-transform: uppercase; letter-spacing: var(--tracking-caps); padding: var(--space-2) var(--space-3) var(--space-1); }
.topbar-actions { margin-left: auto; display: flex; gap: var(--space-2); align-items: center; }
.ref-date { font-size: var(--fs-xs); color: var(--color-text-muted); white-space: nowrap; }

.content { width: 100%; max-width: var(--content-max); margin: 0 auto; padding: var(--space-6); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); }
.page-title { font-family: var(--font-display); font-size: var(--fs-3xl); font-weight: 500; letter-spacing: -0.01em; }
.page-kicker { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--brand-accent-strong); font-weight: var(--fw-semibold); margin-bottom: var(--space-2); }
.page-sub { color: var(--color-text-muted); margin-top: var(--space-2); max-width: 760px; }
.section { margin-top: var(--space-8); }
.section-title { font-size: var(--fs-lg); font-weight: var(--fw-semibold); margin-bottom: var(--space-4); display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.section-title .muted { font-weight: var(--fw-regular); font-size: var(--fs-sm); }

.grid { display: grid; gap: var(--space-4); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.span-2 { grid-column: span 2; }
.row { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.row-between { display: flex; gap: var(--space-3); align-items: center; justify-content: space-between; flex-wrap: wrap; }
.stack > * + * { margin-top: var(--space-3); }

/* =====================================================================
   4. COMPONENTES
   ===================================================================== */
.card {
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); padding: var(--space-5); box-shadow: var(--shadow-sm); min-width: 0;
}
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); margin-bottom: var(--space-4); }
.card-title { font-size: var(--fs-md); font-weight: var(--fw-semibold); }
.card-sub { font-size: var(--fs-xs); color: var(--color-text-subtle); margin-top: 2px; }
.card-foot { margin-top: var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--color-border); font-size: var(--fs-xs); color: var(--color-text-subtle); }
.card.flat { box-shadow: none; }
.card.inset { background: var(--color-surface-2); }

/* KPI */
.kpi { display: flex; flex-direction: column; gap: var(--space-1); }
.kpi-label { font-size: var(--fs-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: var(--tracking-caps); font-weight: var(--fw-medium); }
.kpi-value { font-size: var(--fs-2xl); font-weight: var(--fw-semibold); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.kpi-value.na { font-size: var(--fs-lg); color: var(--color-text-subtle); font-weight: var(--fw-medium); }
.kpi-meta { font-size: var(--fs-xs); color: var(--color-text-subtle); }
.kpi-detail { font-size: var(--fs-sm); color: var(--color-text-muted); }

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-md);
  border: 1px solid var(--color-border-strong); background: var(--color-surface);
  font-size: var(--fs-sm); font-weight: var(--fw-medium); cursor: pointer; white-space: nowrap;
  transition: background var(--duration-fast), border-color var(--duration-fast);
}
.btn:hover { background: var(--color-neutral-soft); text-decoration: none; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.btn-primary { background: var(--brand-ink); border-color: var(--brand-ink); color: #f4f2ee; }
.btn-primary:hover { background: #2a2f37; }
:root[data-theme="dark"] .btn-primary { background: var(--brand-accent); border-color: var(--brand-accent); color: #15191f; }
.btn-accent { background: var(--brand-accent); border-color: var(--brand-accent); color: #fff; }
.btn-accent:hover { background: var(--brand-accent-strong); }
.btn-danger { color: var(--color-negative); }
.btn-danger:hover { background: var(--color-negative-soft); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-sm { height: 30px; padding: 0 var(--space-3); font-size: var(--fs-xs); }
.btn-icon { width: 32px; padding: 0; }

/* Badges e chips */
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
  border-radius: var(--radius-pill); font-size: 0.6875rem; font-weight: var(--fw-semibold);
  background: var(--color-neutral-soft); color: var(--color-text-muted); white-space: nowrap; line-height: 1.5;
}
.badge.pos { background: var(--color-positive-soft); color: var(--color-positive); }
.badge.neg { background: var(--color-negative-soft); color: var(--color-negative); }
.badge.warn { background: var(--color-warning-soft); color: var(--color-warning); }
.badge.info { background: var(--color-info-soft); color: var(--color-info); }
.badge.accent { background: var(--brand-accent-soft); color: var(--brand-accent-strong); }
.badge.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.prov { border: 1px solid currentColor; background: transparent; font-weight: var(--fw-medium); }
.prov-briefing { color: var(--prov-briefing); }
.prov-oficial { color: var(--prov-oficial); }
.prov-terceiros { color: var(--prov-terceiros); }
.prov-hipotese { color: var(--prov-hipotese); }
.prov-interno { color: var(--prov-interno); }
.na { color: var(--color-text-subtle); font-style: italic; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip {
  padding: 6px 12px; border-radius: var(--radius-pill); border: 1px solid var(--color-border-strong);
  background: var(--color-surface); font-size: var(--fs-sm); cursor: pointer; font-weight: var(--fw-medium);
}
.chip[aria-pressed="true"], .chip.active { background: var(--brand-ink); color: #f4f2ee; border-color: var(--brand-ink); }
:root[data-theme="dark"] .chip[aria-pressed="true"], :root[data-theme="dark"] .chip.active { background: var(--brand-accent); color: #15191f; border-color: var(--brand-accent); }
.trend { font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; }
.trend.up { color: var(--color-negative); }    /* aumento de preço do concorrente */
.trend.down { color: var(--color-positive); }
.trend.flat { color: var(--color-text-subtle); }

/* Tabs (seletor de empreendimento Ousy) */
.tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--color-border); margin-bottom: var(--space-5); overflow-x: auto; }
.tab {
  padding: var(--space-3) var(--space-4); border: none; background: none; cursor: pointer; white-space: nowrap;
  font-weight: var(--fw-medium); color: var(--color-text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--color-text); border-bottom-color: var(--brand-accent); }
.tab .count { font-size: var(--fs-xs); color: var(--color-text-subtle); margin-left: 6px; }

/* Tabelas */
.table-wrap { overflow-x: auto; border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface); }
table.data { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.data th, table.data td { padding: 10px var(--space-3); text-align: left; border-bottom: 1px solid var(--color-border); vertical-align: top; }
table.data th {
  font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--color-text-muted);
  text-transform: uppercase; letter-spacing: 0.04em; background: var(--color-surface-2);
  position: sticky; top: 0; white-space: nowrap;
}
table.data th.sortable { cursor: pointer; user-select: none; }
table.data th.sortable:hover { color: var(--color-text); }
table.data th .sort-ind { opacity: 0.5; margin-left: 4px; }
table.data tbody tr:hover { background: var(--color-surface-2); }
table.data tbody tr:last-child td { border-bottom: none; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data td.actions { white-space: nowrap; text-align: right; width: 1%; }
table.data .row-ousy { background: var(--brand-accent-soft); }
table.compare th[scope="row"] { position: sticky; left: 0; background: var(--color-surface-2); text-transform: none; letter-spacing: 0; font-size: var(--fs-sm); color: var(--color-text-muted); min-width: 170px; }
table.compare td { min-width: 180px; }
.table-toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-bottom: var(--space-3); }
.table-toolbar .grow { flex: 1; min-width: 180px; }
.table-foot { font-size: var(--fs-xs); color: var(--color-text-subtle); margin-top: var(--space-2); }

/* Formulários */
.input, select.input, textarea.input {
  width: 100%; height: 36px; padding: 0 var(--space-3);
  border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); background: var(--color-surface);
}
textarea.input { height: auto; min-height: 84px; padding: var(--space-2) var(--space-3); resize: vertical; }
select.input[multiple] { height: auto; min-height: 120px; padding: var(--space-1); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.modal { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 820px; }

.modal.lg { max-width: 1080px; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--color-border); gap: var(--space-3); }
.modal-title { font-size: var(--fs-lg); font-weight: var(--fw-semibold); }
.modal-body { padding: var(--space-6); }
.modal-foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-4) var(--space-6); border-top: 1px solid var(--color-border); background: var(--color-surface-2); border-radius: 0 0 var(--radius-lg) var(--radius-lg); flex-wrap: wrap; }

/* Ficha (definição de campos) */
.dl { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 0; font-size: var(--fs-sm); }
.dl dt, .dl dd { padding: 9px 0; border-bottom: 1px solid var(--color-border); margin: 0; }

.dl dd { min-width: 0; overflow-wrap: anywhere; }

.dl dd .src { font-size: var(--fs-xs); color: var(--color-text-subtle); margin-left: 6px; }

.dev-card:hover { border-color: var(--brand-accent); box-shadow: var(--shadow-md); }

.dev-card .facts span { display: block; font-size: var(--fs-xs); color: var(--color-text-subtle); }
.ousy-ref { border-left: 3px solid var(--brand-accent); }

/* Callouts */
.callout { border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: var(--fs-sm); background: var(--color-info-soft); color: var(--color-text); border-left: 3px solid var(--color-info); }

.callout.neutral { background: var(--color-neutral-soft); border-left-color: var(--color-border-strong); }

/* Lista / timeline */
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border); font-size: var(--fs-sm); }
.list li:last-child { border-bottom: none; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 var(--space-5); border-left: 2px solid var(--color-border); }
.timeline li { position: relative; padding: 0 0 var(--space-5) var(--space-3); font-size: var(--fs-sm); }
.timeline li::before { content: ""; position: absolute; left: calc(-1 * var(--space-5) - 7px); top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--color-surface); border: 2px solid var(--brand-accent); }
.timeline .when { font-size: var(--fs-xs); color: var(--color-text-subtle); }
.diff-old { color: var(--color-negative); text-decoration: line-through; overflow-wrap: anywhere; }
.diff-new { color: var(--color-positive); overflow-wrap: anywhere; }

/* Alertas */
.alert-item { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border); font-size: var(--fs-sm); }
.alert-item:last-child { border-bottom: none; }

.alert-ico.ad { background: var(--brand-accent-soft); color: var(--brand-accent-strong); }

/* Gráficos */
.chart-box { position: relative; height: 280px; }
.chart-box.tall { height: 360px; }
.chart-box.short { height: 220px; }
.chart-empty { display: grid; place-items: center; height: 100%; color: var(--color-text-subtle); font-size: var(--fs-sm); text-align: center; padding: var(--space-4); border: 1px dashed var(--color-border); border-radius: var(--radius-md); }

/* Biblioteca visual (criativos / publicações) */
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-4); }
.lib-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; }

.lib-body { padding: var(--space-3) var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); font-size: var(--fs-sm); flex: 1; }

.hero {

/* -----------------------------------------------------------------------
   2. UTILITÁRIOS
   ----------------------------------------------------------------------- */
const U = {
  uid(prefix = 'id') {
    const r = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)));
    return `${prefix}-${r}`;
  },
  nowIso: () => new Date().toISOString(),
  today: () => new Date().toISOString().slice(0, 10),
  /** Escapa texto para HTML. Use em TODO conteúdo vindo de dados. */
  h(v) {
    if (v === null || v === undefined) return '';
    return String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  isEmpty: v => v === null || v === undefined || v === '' || (Array.isArray(v) && v.length === 0),
  get(obj, path) { return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj); },
  set(obj, path, value) {
    const keys = path.split('.'); let o = obj;
    keys.slice(0, -1).forEach(k => { if (o[k] == null || typeof o[k] !== 'object') o[k] = {}; o = o[k]; });
    o[keys[keys.length - 1]] = value; return obj;
  },
  clone: o => JSON.parse(JSON.stringify(o)),
  /** Achata objeto aninhado em { 'a.b': v } (arrays são mantidos). */
  flatten(obj, prefix = '', out = {}) {
    Object.entries(obj || {}).forEach(([k, v]) => {
      const key = prefix ? `${prefix}.${k}` : k;
      if (v && typeof v === 'object' && !Array.isArray(v)) U.flatten(v, key, out); else out[key] = v;
    });
    return out;
  },
  brl(v, opts = {}) {
    if (v === null || v === undefined || v === '' || isNaN(v)) return null;
    return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: opts.dec ?? 0, minimumFractionDigits: opts.dec ?? 0 });
  },
  num(v, dec = 0) {
    if (v === null || v === undefined || v === '' || isNaN(v)) return null;
    return Number(v).toLocaleString('pt-BR', { maximumFractionDigits: dec, minimumFractionDigits: 0 });
  },
  area(v) { const n = U.num(v, 1); return n === null ? null : `${n} m²`; },
  pct(v, dec = 1) { if (v === null || v === undefined || isNaN(v)) return null; return `${v > 0 ? '+' : ''}${Number(v).toLocaleString('pt-BR', { maximumFractionDigits: dec, minimumFractionDigits: dec })}%`; },
  /** '2026-10-08' ou ISO → '08/10/2026' */
  date(v) {
    if (!v) return null;
    const s = String(v).slice(0, 10); const [y, m, d] = s.split('-');
    return d ? `${d}/${m}/${y}` : s;
  },
  dateTime(v) { if (!v) return null; const d = new Date(v); return isNaN(d) ? v : d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }); },
  MONTHS: ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'],
  /** 'AAAA-MM' → 'mai/2029'; 'AAAA' → '2026' */
  ym(v) {
    if (!v) return null; const [y, m] = String(v).split('-');
    return m ? `${U.MONTHS[Number(m) - 1]}/${y}` : y;
  },
  /** Converte 'AAAA-MM' ou 'AAAA' em Date (último dia do período quando só há ano). */
  ymToDate(v, end = false) {
    if (!v) return null; const [y, m] = String(v).split('-').map(Number);
    if (!m) return end ? new Date(y, 11, 31) : new Date(y, 0, 1);
    return end ? new Date(y, m, 0) : new Date(y, m - 1, 1);
  },
  daysBetween(a, b) { return Math.round((b - a) / 86400000); },
  daysSince(v) { if (!v) return null; const d = new Date(String(v).length === 10 ? v + 'T12:00:00' : v); return U.daysBetween(d, new Date()); },
  /** Marcação padrão de informação indisponível. Nunca preencher por suposição. */
  NA: '<span class="na">Não informado</span>',
  /** Formata o valor ou devolve "Não informado". */
  show(v, fmt) {
    if (U.isEmpty(v)) return U.NA;
    const out = fmt ? fmt(v) : v;
    return out === null || out === undefined ? U.NA : (fmt ? out : U.h(out));
  },
  debounce(fn, ms = 200) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  slug: s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''),
  norm: s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(),
  mean: arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null,
  median(arr) { if (!arr.length) return null; const s = [...arr].sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; },
  groupBy(arr, fn) { return arr.reduce((acc, x) => { const k = fn(x); (acc[k] = acc[k] || []).push(x); return acc; }, {}); },
  safeUrl(u) { if (!u) return null; try { const x = new URL(u); return ['http:', 'https:'].includes(x.protocol) ? x.href : null; } catch { return null; } },
  link(u, label) { const s = U.safeUrl(u); return s ? `<a href="${U.h(s)}" target="_blank" rel="noopener noreferrer">${U.h(label || u)}</a>` : U.NA; },
  lines: v => (Array.isArray(v) ? v : String(v || '').split(/\n+/)).map(s => String(s).trim()).filter(Boolean),

  /* CSV ------------------------------------------------------------- */
  toCSV(rows, columns) {
    const esc = v => {
      if (v === null || v === undefined) return '';
      const s = Array.isArray(v) ? v.join(' | ') : (typeof v === 'object' ? JSON.stringify(v) : String(v));
      return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const head = columns.map(c => esc(c)).join(';');
    return '﻿' + [head, ...rows.map(r => columns.map(c => esc(r[c])).join(';'))].join('\r\n');
  },
  /** Parser CSV (separador ; ou , detectado pela primeira linha; suporta aspas). */
  parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
    const rows = []; let row = [], field = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else field += c;
      } else if (c === '"') q = true;
      else if (c === sep) { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    const nonEmpty = rows.filter(r => r.some(x => x !== ''));
    const [header, ...body] = nonEmpty;
    return body.map(r => Object.fromEntries(header.map((h, i) => [h.trim(), r[i] ?? ''])));
  },
  download(filename, content, mime = 'application/octet-stream') {
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  readFile(file, as = 'text') {
    return new Promise((res, rej) => {
      const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error);
      as === 'dataURL' ? r.readAsDataURL(file) : r.readAsText(file);
    });
  },
  cssVar: name => getComputedStyle(document.documentElement).getPropertyValue(name).trim(),
  haversine(a, b) {
    const R = 6371000, toR = x => x * Math.PI / 180;
    const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
    const s = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(s));
  },
  prefersReducedMotion: () => window.matchMedia('(prefers-reduced-motion: reduce)').matches
};
const h = U.h;

/* -----------------------------------------------------------------------
   3. PERSISTÊNCIA — IndexedDB (fallback em memória se indisponível)
   ----------------------------------------------------------------------- */
const DB = {
  db: null,
  memory: null, // usado apenas se IndexedDB não estiver disponível
  open() {
    return new Promise(resolve => {
      if (!('indexedDB' in window)) { this.memory = {}; return resolve(false); }
      let req;
      try { req = indexedDB.open(CONFIG.dbName, CONFIG.dbVersion); } catch { this.memory = {}; return resolve(false); }
      req.onupgradeneeded = () => {
        const db = req.result;
        STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
      };
      req.onsuccess = () => { this.db = req.result; resolve(true); };
      req.onerror = () => { this.memory = {}; resolve(false); };
    });
  },
  tx(store, mode, fn) {
    if (this.memory) {
      this.memory[store] = this.memory[store] || new Map();
      return Promise.resolve(fn(null, this.memory[store]));
    }
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const os = t.objectStore(store);
      let result; const r = fn(os); if (r && 'onsuccess' in r) r.onsuccess = () => { result = r.result; };
      t.oncomplete = () => res(result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(store) { return this.tx(store, 'readonly', (os, mem) => mem ? [...mem.values()] : os.getAll()).then(r => r || []); },
  put(store, rec) { return this.tx(store, 'readwrite', (os, mem) => mem ? mem.set(rec.id, U.clone(rec)) : os.put(rec)); },
  putMany(store, recs) { return this.tx(store, 'readwrite', (os, mem) => { recs.forEach(r => mem ? mem.set(r.id, U.clone(r)) : os.put(r)); }); },
  del(store, id) { return this.tx(store, 'readwrite', (os, mem) => mem ? mem.delete(id) : os.delete(id)); },
  clear(store) { return this.tx(store, 'readwrite', (os, mem) => mem ? mem.clear() : os.clear()); }
};

/* -----------------------------------------------------------------------
   4. REPOSITÓRIO — cache em memória + CRUD + histórico automático
   ----------------------------------------------------------------------- */
const Store = {
  data: {},
  listeners: new Set(),
  async load() { for (const s of STORES) this.data[s] = await DB.all(s); },
  list(s) { return this.data[s] || []; },
  get(s, id) { return this.list(s).find(r => r.id === id) || null; },
  where(s, fn) { return this.list(s).filter(fn); },
  byDev(s, devId) { return this.list(s).filter(r => r.developmentId === devId); },
  setting(key, fallback = null) { const r = this.get('meta', 'settings'); return r && r[key] !== undefined ? r[key] : fallback; },
  async saveSetting(key, value) {
    const r = this.get('meta', 'settings') || { id: 'settings', createdAt: U.nowIso() };
    r[key] = value; r.updatedAt = U.nowIso(); await this._write('meta', r);
  },
  onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  _emit(store) { this.listeners.forEach(fn => { try { fn(store); } catch (e) { console.error(e); } }); },
  async _write(s, rec) {
    await DB.put(s, rec);
    const arr = this.data[s] = this.data[s] || []; const i = arr.findIndex(r => r.id === rec.id);
    if (i >= 0) arr[i] = rec; else arr.push(rec);
  },
  /** Cria registro. ctx: { sourceId, note, silent } */
  async create(s, rec, ctx = {}) {
    const now = U.nowIso();
    const r = { ...rec, id: rec.id || U.uid(s.slice(0, 4)), createdAt: rec.createdAt || now, updatedAt: now };
    await this._write(s, r);
    if (LOGGED_STORES.includes(s) && !ctx.silent) await this.log(s, r, '(registro criado)', null, Schemas.title(s, r), ctx);
    this._emit(s); return r;
  },
  /** Atualiza registro gravando no histórico cada campo alterado (valor anterior → novo valor). */
  async update(s, id, patch, ctx = {}) {
    const old = this.get(s, id); if (!old) throw new Error('Registro não encontrado');
    const next = { ...U.clone(old), ...patch, id, createdAt: old.createdAt, updatedAt: U.nowIso() };
    await this._write(s, next);
    if (LOGGED_STORES.includes(s) && !ctx.silent) {
      const a = U.flatten(old), b = U.flatten(next);
      const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
      for (const k of keys) {
        if (['updatedAt', 'createdAt', 'id'].includes(k)) continue;
        const va = a[k], vb = b[k];
        // listas (fontes, tags, empresas) são comparadas sem considerar a ordem
        const canon = v => JSON.stringify(Array.isArray(v) ? [...v].map(String).sort() : (v ?? null));
        const same = canon(va) === canon(vb) || (U.isEmpty(va) && U.isEmpty(vb));
        if (!same) await this.log(s, next, k, va, vb, ctx);
      }
    }
    this._emit(s); return next;
  },
  async remove(s, id, ctx = {}) {
    const old = this.get(s, id); if (!old) return;
    await DB.del(s, id); this.data[s] = this.list(s).filter(r => r.id !== id);
    if (LOGGED_STORES.includes(s) && !ctx.silent) await this.log(s, old, '(registro excluído)', Schemas.title(s, old), null, ctx);
    this._emit(s);
  },
  async log(store, rec, field, oldValue, newValue, ctx = {}) {
    const entry = {
      id: U.uid('log'), createdAt: U.nowIso(), updatedAt: U.nowIso(), at: U.nowIso(),
      entity: store, entityId: rec.id, entityTitle: Schemas.title(store, rec),
      developmentId: store === 'developments' ? rec.id : (rec.developmentId || null),
      field, fieldLabel: Schemas.fieldLabel(store, field),
      oldValue: oldValue === undefined ? null : oldValue, newValue: newValue === undefined ? null : newValue,
      user: ctx.user || this.setting('userName') || null,
      sourceId: ctx.sourceId || null, note: ctx.note || null
    };
    await this._write('changeLog', entry);
  },
  /** Exporta todas as coleções (backup completo). */
  snapshot() {
    const out = { app: 'ousy-intelligence', version: CONFIG.appVersion, exportedAt: U.nowIso(), data: {} };
    STORES.forEach(s => { out.data[s] = this.list(s); });
    return out;
  },
  /** Importa backup. mode: 'replace' (substitui tudo) | 'merge' (insere/atualiza por id). */
  async importSnapshot(snap, mode = 'merge') {
    if (!snap || !snap.data) throw new Error('Arquivo inválido: estrutura "data" ausente.');
    for (const s of STORES) {
      const recs = (snap.data[s] || []).filter(r => r && r.id);
      if (mode === 'replace') await DB.clear(s);
      if (recs.length) await DB.putMany(s, recs);
    }
    await this.load(); this._emit('*');
  }
};

/* -----------------------------------------------------------------------
   5. CARGA INICIAL (seed do briefing) — executada apenas uma vez
   ----------------------------------------------------------------------- */
const Seed = {
  read() { return JSON.parse(document.getElementById('seed-data').textContent); },
  async ensure() {
    const seed = this.read();
    if (Store.get('meta', 'seed')) return false;
    await this.apply(seed);
    return true;
  },
  async apply(seed) {
    const now = U.nowIso(); const ref = seed.referenceDate; const src = seed.sources[0].id;
    const base = (extra = {}) => ({
      createdAt: now, updatedAt: now, provenance: 'briefing', verification: 'pendente',
      sourceIds: [src], referenceDate: ref, ...extra
    });
    const put = (s, recs) => DB.putMany(s, recs);
    await put('sources', seed.sources.map(r => ({ ...base(), sourceIds: [], ...r })));
    await put('companies', seed.companies.map(r => ({ ...base(), ...r })));
    await put('stations', seed.stations.map(r => ({
      ...base({ provenance: 'interno', sourceIds: [] }), geo: { lat: null, lng: null, status: 'nao_geocodificado' }, ...r
    })));
    await put('developments', seed.developments.map(r => ({
      ...base(), ...Schemas.devDefaults(), ...r,
      address: { ...Schemas.devDefaults().address, ...r.address }
    })));
    await put('proximities', seed.proximities.map(r => ({ ...base(), id: U.uid('prox'), stationText: null, ...r })));
    await put('typologies', seed.typologies.map(r => ({ ...base(), id: U.uid('typ'), areaMin: null, areaMax: null, ...r })));
    await put('prices', seed.prices.map(r => ({
      ...base(), id: U.uid('price'), collectedAt: ref, unit: null, isPromo: false, conditions: null, ...r
    })));
    await DB.put('changeLog', {
      id: U.uid('log'), createdAt: now, updatedAt: now, at: now, entity: 'sources', entityId: src,
      entityTitle: 'Briefing inicial', developmentId: null, field: '(carga inicial)', fieldLabel: 'Carga inicial',
      oldValue: null, newValue: `${seed.developments.length} empreendimentos, ${seed.prices.length} preços e ${seed.proximities.length} registros de proximidade importados do briefing (ref. ${U.date(ref)})`,
      user: 'Sistema', sourceId: src, note: 'Registros pendentes de validação externa.'
    });
    await DB.put('meta', { id: 'seed', createdAt: now, updatedAt: now, seedVersion: seed.seedVersion, referenceDate: ref });
    await Store.load();
  }
};

  get(store) { return this.defs[store]; },
  title(store, r) { try { return (this.defs[store] && this.defs[store].title(r)) || r.name || r.title || r.id; } catch { return r.id; } },
  fieldLabel(store, key) {
    const f = this.defs[store] && this.defs[store].fields.find(x => x.key === key);
    if (f) return f.label;
    if (key.startsWith('geo.')) return { 'geo.lat': 'Latitude', 'geo.lng': 'Longitude', 'geo.status': 'Status da geolocalização', 'geo.source': 'Fonte da geolocalização', 'geo.geocodedAt': 'Data da geocodificação', 'geo.displayName': 'Endereço geocodificado' }[key] || key;
    return key;
  },
  devName(id) { const d = Store.get('developments', id); return d ? d.name : '—'; },
  /** Valor legível de um campo (para histórico e exportação). */
  display(store, key, v) {
    if (U.isEmpty(v)) return '—';
    const f = this.defs[store] && this.defs[store].fields.find(x => x.key === key);
    if (!f) return Array.isArray(v) ? v.join(', ') : String(v);
    if (f.enum) return (Array.isArray(v) ? v : [v]).map(x => ENUMS[f.enum][x] || x).join(', ');
    if (f.type === 'ref' || f.type === 'refmulti') {
      const store2 = f.ref || 'developments';
      return (Array.isArray(v) ? v : [v]).map(id => { const r = Store.get(store2, id); return r ? Schemas.title(store2, r) : id; }).join(', ');
    }
    if (f.type === 'checkbox') return v ? 'Sim' : 'Não';
    if (f.type === 'number' && /value|preço/i.test(key + f.label)) return U.brl(v, { dec: 0 });
    if (f.type === 'date') return U.date(v);
    if (f.type === 'ym') return U.ym(v);
    if (f.type === 'files') return `${v.length} arquivo(s)`;
    return Array.isArray(v) ? v.join(', ') : String(v);
  }
};

/* -----------------------------------------------------------------------
   7. ANALYTICS — funções puras sobre o repositório
   Regras de negócio importantes:
   - Preço "a partir de" nunca é tratado como preço médio de mercado.
   - R$/m² só é calculado quando o preço está vinculado a uma metragem
     (campo areaM2 preenchido a partir da fonte).
   - Preço anunciado ≠ preço negociado.
   ----------------------------------------------------------------------- */
const A = {
  devs: () => Store.list('developments'),
  ousy: () => A.devs().filter(d => d.isOusy).sort((a, b) => (a.displayOrder ?? 99) - (b.displayOrder ?? 99) || a.name.localeCompare(b.name)),
  competitors: (ousyId) => A.devs().filter(d => !d.isOusy && (!ousyId || d.ousyRefId === ousyId)).sort((a, b) => a.name.localeCompare(b.name)),
  groupOf(dev) { return dev.isOusy ? dev : Store.get('developments', dev.ousyRefId); },
  groupName(dev) { const g = A.groupOf(dev); return g ? g.name : 'Sem grupo'; },
  companies(dev) { return (dev.companyIds || []).map(id => Store.get('companies', id)).filter(Boolean); },
  companiesText(dev) { const c = A.companies(dev); return c.length ? c.map(x => x.name).join(', ') : null; },
  addressText(dev) {
    const a = dev.address || {};
    if (dev.addressStatus === 'nao_divulgado' && !a.street) return a.neighborhood ? `${a.neighborhood} (endereço exato não divulgado)` : null;
    const parts = [a.street ? `${a.street}${a.number ? ', ' + a.number : ', nº não informado'}` : null, a.neighborhood, a.city && a.uf ? `${a.city}/${a.uf}` : a.city];
    return parts.filter(Boolean).join(' — ') || null;
  },
  areaText(dev) {
    if (dev.areaMin == null && dev.areaMax == null) return null;
    if (dev.areaQualifier === 'a_partir_de' || dev.areaMax == null) return `a partir de ${U.area(dev.areaMin)}`;
    if (dev.areaMin === dev.areaMax) return U.area(dev.areaMin);
    return `${U.num(dev.areaMin, 1)} a ${U.area(dev.areaMax)}`;
  },
  prices(devId) { return Store.byDev('prices', devId).sort((a, b) => String(a.collectedAt).localeCompare(String(b.collectedAt)) || String(a.createdAt).localeCompare(String(b.createdAt))); },
  priceKey: p => [p.developmentId, U.norm(p.typologyLabel), U.norm(p.unit), p.areaM2 ?? '', p.priceType].join('|'),
  /** Série histórica por chave (empreendimento + tipologia + unidade + metragem + tipo). */
  priceSeries(devId) {
    const list = devId ? A.prices(devId) : [...Store.list('prices')].sort((a, b) => String(a.collectedAt).localeCompare(String(b.collectedAt)));
    return U.groupBy(list, A.priceKey);
  },
  latestPrices(devId) { return Object.values(A.priceSeries(devId)).map(s => s[s.length - 1]); },
  /** Preço inicial divulgado = menor preço vigente (último de cada série). */
  startingPrice(dev) {
    const latest = A.latestPrices(dev.id); if (!latest.length) return null;
    return latest.reduce((m, p) => (m === null || p.value < m.value ? p : m), null);
  },
  ppm2: p => (p && p.areaM2 && p.value ? p.value / p.areaM2 : null),
  /** Variações entre as duas últimas coletas de cada série. */
  priceChanges(devId) {
    return Object.values(A.priceSeries(devId)).filter(s => s.length >= 2).map(s => {
      const prev = s[s.length - 2], curr = s[s.length - 1];
      return { dev: Store.get('developments', curr.developmentId), prev, curr, diff: curr.value - prev.value, pct: prev.value ? ((curr.value - prev.value) / prev.value) * 100 : null };
    }).filter(c => c.diff !== 0 && c.dev);
  },
  proximities(devId) { return Store.byDev('proximities', devId).sort((a, b) => (a.distanceM ?? 1e9) - (b.distanceM ?? 1e9)); },
  nearest(dev) { const p = A.proximities(dev.id); return p.length ? p[0] : null; },
  stationName(p) { if (!p) return null; const s = p.stationId && Store.get('stations', p.stationId); return s ? s.name : null; },
  distanceText(p) {
    if (!p) return null;
    if (p.distanceM != null) return `${p.qualifier === 'exata' ? '' : '≈ '}${U.num(p.distanceM)} m${A.stationName(p) ? ' · ' + A.stationName(p) : ''}`;
    return p.text || ENUMS.proxQualifier[p.qualifier];
  },
  delivery(dev) {
    if (dev.deliveryActual) return { kind: 'actual', ym: dev.deliveryActual, date: U.ymToDate(dev.deliveryActual, true) };
    if (dev.deliveryForecast) return { kind: 'forecast', ym: dev.deliveryForecast, date: U.ymToDate(dev.deliveryForecast, true) };
    return null;
  },
  deliveryText(dev) {
    const d = A.delivery(dev); if (!d) return null;
    return d.kind === 'actual' ? `Entregue: ${U.ym(d.ym)}` : `Prevista: ${U.ym(d.ym)}`;
  },
  monthsToDelivery(dev) { const d = A.delivery(dev); if (!d || d.kind === 'actual') return null; return Math.round(U.daysBetween(new Date(), d.date) / 30.44); },
  related(devId) {
    return ['prices', 'proximities', 'typologies', 'campaigns', 'websites', 'seoAudits', 'ads', 'socialPosts'].flatMap(s => Store.byDev(s, devId))
      .concat(Store.list('socialProfiles').filter(p => p.developmentId === devId));
  },
  lastUpdate(dev) {
    const dates = [dev.updatedAt, ...A.related(dev.id).map(r => r.updatedAt)].filter(Boolean).sort();
    return dates[dates.length - 1] || null;
  },
  /** Referência de verificação: lastVerifiedAt, ou data de referência (briefing). */
  verificationAge(rec) { return U.daysSince(rec.lastVerifiedAt || rec.referenceDate || rec.createdAt); },
  isStale(rec) { const age = A.verificationAge(rec); return rec.verification === 'desatualizado' || (age !== null && age > CONFIG.staleDays); },
  stageBucket(dev) {
    return { nao_informado: 'Não informado', pre_lancamento: 'Na planta', lancamento: 'Na planta', fundacao: 'Em obras', em_obras: 'Em obras', pronto: 'Pronto/entregue', entregue: 'Pronto/entregue' }[dev.stage] || 'Não informado';
  },
  typologyKinds(dev) { return new Set(Store.byDev('typologies', dev.id).map(t => t.kind)); },
  /** Classifica a comparação entre dois produtos como direta ou não, com justificativas. */
  comparability(a, b) {
    const reasons = [];
    const ga = A.groupOf(a), gb = A.groupOf(b);
    if (!ga || !gb || ga.id !== gb.id) reasons.push('pertencem a grupos/regiões de referência diferentes');
    if (a.areaMin != null && b.areaMin != null) {
      const aMax = a.areaMax ?? Infinity, bMax = b.areaMax ?? Infinity;
      if (a.areaMin > bMax || b.areaMin > aMax) reasons.push('faixas de metragem não se sobrepõem');
    } else reasons.push('metragem não informada em um dos produtos');
    const ka = A.typologyKinds(a), kb = A.typologyKinds(b);
    if (ka.size && kb.size && ![...ka].some(k => kb.has(k))) reasons.push('tipologias distintas');
    if (!ka.size || !kb.size) reasons.push('tipologia não informada em um dos produtos');
    const sa = A.stageBucket(a), sb = A.stageBucket(b);
    if (sa !== sb && sa !== 'Não informado' && sb !== 'Não informado') reasons.push(`estágios distintos (${sa} × ${sb})`);
    return { direct: reasons.length === 0, reasons };
  },
  /** Agrega argumentos comerciais registrados (anúncios, publicações, auditorias). */
  argCounts(devIds) {
    const set = devIds ? new Set(devIds) : null; const counts = {};
    ['ads', 'socialPosts', 'seoAudits'].forEach(s => Store.list(s).forEach(r => {
      if (set && !set.has(r.developmentId)) return;
      (r.argTags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; });
    }));
    return counts;
  },
  /** Alertas derivados dos dados armazenados. */
  alerts() {
    const out = []; const now = new Date(); const states = Store.list('alertStates');
    const dismissed = new Set(states.filter(s => s.status === 'dismissed').map(s => s.id));
    // 1. Mudanças de preço
    A.priceChanges().forEach(c => out.push({
      key: `price:${c.curr.id}`, type: 'price', devId: c.dev.id, date: c.curr.collectedAt,
      title: `${c.dev.name}: preço ${c.diff > 0 ? 'aumentou' : 'reduziu'} ${U.pct(c.pct)}`,
      detail: `${c.curr.typologyLabel}: ${U.brl(c.prev.value)} (${U.date(c.prev.collectedAt)}) → ${U.brl(c.curr.value)} (${U.date(c.curr.collectedAt)}) · ${ENUMS.priceType[c.curr.priceType]}`
    }));
    // 2. Entregas previstas próximas
    A.devs().forEach(d => {
      if (!d.deliveryForecast || d.deliveryActual) return;
      const end = U.ymToDate(d.deliveryForecast, true); const days = U.daysBetween(now, end);
      if (days <= CONFIG.deliverySoonDays) out.push({
        key: `delivery:${d.id}:${d.deliveryForecast}`, type: 'delivery', devId: d.id, date: d.deliveryForecast,
        title: `${d.name}: entrega prevista ${days < 0 ? 'vencida' : 'próxima'} (${U.ym(d.deliveryForecast)})`,
        detail: days < 0 ? `Previsão expirou há ${-days} dias — verificar se houve entrega ou nova data.` : `Faltam ${days} dias para o fim do mês previsto.`
      });
    });
    // 3. Dados desatualizados / pendentes
    A.devs().forEach(d => {
      if (A.isStale(d)) out.push({
        key: `stale:${d.id}:${d.lastVerifiedAt || d.referenceDate}`, type: 'stale', devId: d.id, date: d.lastVerifiedAt || d.referenceDate,
        title: `${d.name}: dados sem verificação há ${A.verificationAge(d)} dias`, detail: 'Revisar ficha e registrar nova data de verificação.'
      });
    });
    // 4. Novos anúncios e campanhas
    Store.list('ads').forEach(ad => {
      if (U.daysSince(ad.createdAt) <= CONFIG.recentDays) out.push({
        key: `ad:${ad.id}`, type: 'ad', devId: ad.developmentId, date: ad.identifiedAt,
        title: `Novo anúncio: ${ad.advertiser || ''} · ${ENUMS.adPlatform[ad.platform] || ''}`, detail: ad.headline || ad.offer || ''
      });
    });
    Store.list('campaigns').forEach(c => {
      if (U.daysSince(c.createdAt) <= CONFIG.recentDays) out.push({
        key: `camp:${c.id}`, type: 'ad', devId: c.developmentId, date: c.identifiedAt,
        title: `Nova campanha: ${c.name}`, detail: `${Schemas.devName(c.developmentId)} · ${c.offer || ''}`
      });
    });
    return out.filter(a => !dismissed.has(a.key)).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
  },
  /** Pendências de verificação em todas as coleções relevantes. */
  pendingVerification() {
    return ['developments', 'prices', 'proximities', 'typologies', 'companies', 'stations', 'campaigns', 'ads', 'socialProfiles', 'seoAudits']
      .flatMap(s => Store.list(s).filter(r => r.verification === 'pendente' || r.verification === 'divergente').map(r => ({ store: s, rec: r })));
  },
  /** Campos essenciais ausentes por empreendimento (lacunas de dados). */
  gaps(dev) {
    const g = [];
    if (!A.startingPrice(dev)) g.push('preço');
    if (!A.delivery(dev)) g.push('entrega');
    if (dev.stage === 'nao_informado') g.push('estágio da obra');
    if (!dev.units) g.push('nº de unidades');
    if (!A.companiesText(dev)) g.push('incorporadora');
    if (!A.proximities(dev.id).some(p => p.distanceM != null)) g.push('distância numérica ao metrô');
    if (!dev.address || !dev.address.number) g.push('número do endereço');
    if (!dev.links || !dev.links.site) g.push('site oficial');
    return g;
  }
};

const icon = (name, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;

const UI = {
  /** Badge de enumeração com tom semântico. */
  enumBadge(enumName, v) {
    if (U.isEmpty(v)) return '<span class="badge">Não informado</span>';
    const tone = (ENUM_TONE[enumName] || {})[v] || '';
    return `<span class="badge ${tone}">${h(ENUMS[enumName][v] || v)}</span>`;
  },
  prov(v) { return v ? `<span class="badge prov prov-${h(v)}" title="Natureza do dado">${h(ENUMS.provenance[v] || v)}</span>` : ''; },
  ver(v) { return UI.enumBadge('verification', v); },
  govBadges(r) { return `${UI.prov(r.provenance)} ${r.verification ? UI.ver(r.verification) : ''}`; },
  stage(dev) { return UI.enumBadge('stage', dev.stage); },
  trend(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return '<span class="trend flat">—</span>';
    if (Math.abs(pct) < 0.05) return '<span class="trend flat">0,0%</span>';
    return `<span class="trend ${pct > 0 ? 'up' : 'down'}">${pct > 0 ? '▲' : '▼'} ${U.pct(Math.abs(pct)).replace('+', '')}</span>`;
  },
  sources(ids) {
    const list = (ids || []).map(id => Store.get('sources', id)).filter(Boolean);
    if (!list.length) return '<span class="xs subtle">Fonte não registrada</span>';
    return list.map(s => `<span class="xs subtle" title="${h(ENUMS.sourceType[s.type] || '')}">Fonte: ${s.url ? U.link(s.url, s.title) : h(s.title)} (${h(U.date(s.accessedAt) || 's/ data')})</span>`).join('<br>');
  },
  toast(msg, type = '') {
    const el = document.createElement('div'); el.className = `toast ${type}`; el.textContent = msg;
    document.getElementById('toasts').appendChild(el); setTimeout(() => el.remove(), 4200);
  },
  /** Modal genérico. Retorna { el, close }. */
  modal({ title, body, footer = '', size = '', onClose }) {
    const root = document.getElementById('modal-root');
    const wrap = document.createElement('div'); wrap.className = 'modal-backdrop';
    wrap.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${h(title)}">
      <div class="modal-head"><div class="modal-title">${h(title)}</div><button class="btn btn-ghost btn-icon" data-close aria-label="Fechar">✕</button></div>
      <div class="modal-body"></div>${footer !== null ? `<div class="modal-foot">${footer}</div>` : ''}</div>`;
    const bodyEl = wrap.querySelector('.modal-body');
    if (typeof body === 'string') bodyEl.innerHTML = body; else if (body) bodyEl.appendChild(body);
    const prevFocus = document.activeElement;
    const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); prevFocus && prevFocus.focus && prevFocus.focus(); };
    const onKey = e => { if (e.key === 'Escape' && root.lastElementChild === wrap) close(); };
    wrap.addEventListener('mousedown', e => { if (e.target === wrap) close(); });
    wrap.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
    document.addEventListener('keydown', onKey);
    root.appendChild(wrap);
    const first = wrap.querySelector('input, select, textarea, button:not([data-close])'); first && first.focus();
    return { el: wrap, body: bodyEl, close };
  },
  /** Confirmação explícita (usada antes de excluir/substituir dados). */
  confirm(message, { okLabel = 'Confirmar', danger = true, title = 'Confirmar ação' } = {}) {
    return new Promise(resolve => {
      let done = false;
      const m = UI.modal({
        title, size: 'sm', body: `<p>${message}</p>`,
        footer: `<button class="btn" data-close>Cancelar</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${h(okLabel)}</button>`,
        onClose: () => { if (!done) resolve(false); }
      });
      m.el.querySelector('[data-ok]').addEventListener('click', () => { done = true; m.close(); resolve(true); });
    });
  },

  /* ---------- Formulário a partir do esquema ---------- */
  buildForm(store, record = {}, { withChangeContext = false } = {}) {
    const schema = Schemas.get(store);
    const form = document.createElement('form'); form.className = 'form-grid'; form.noValidate = true;
    const pendingFiles = {}; // key -> [attachmentIds]
    let html = '';
    schema.fields.forEach((f, i) => {
      if (f.group) { html += `<div class="form-group-title">${h(f.group)}</div>`; return; }
      const id = `f-${store}-${i}`; const v = U.get(record, f.key);
      const cls = `field ${f.required ? 'req' : ''} ${f.full || ['textarea', 'tags', 'lines', 'files', 'refmulti'].includes(f.type) ? 'full' : ''} ${f.type === 'checkbox' ? 'check' : ''}`;
      let input = '';
      const opts = () => {
        if (f.enum) return Object.entries(ENUMS[f.enum]);
        if (f.options) return f.options();
        if (f.ref) return Store.list(f.ref).map(r => [r.id, Schemas.title(f.ref, r)]).sort((a, b) => String(a[1]).localeCompare(String(b[1])));
        return [];
      };
      switch (f.type) {
        case 'textarea': input = `<textarea class="input" id="${id}" name="${f.key}">${h(v ?? '')}</textarea>`; break;
        case 'lines': input = `<textarea class="input" id="${id}" name="${f.key}" placeholder="Um item por linha">${h(U.lines(v).join('\n'))}</textarea>`; break;
        case 'number': input = `<input class="input" type="number" id="${id}" name="${f.key}" step="${f.step || '1'}" value="${v ?? ''}">`; break;
        case 'date': input = `<input class="input" type="date" id="${id}" name="${f.key}" value="${h(v ? String(v).slice(0, 10) : '')}">`; break;
        case 'ym': input = `<input class="input" type="text" id="${id}" name="${f.key}" placeholder="AAAA-MM ou AAAA" pattern="\\d{4}(-\\d{2})?" value="${h(v ?? '')}">`; break;
        case 'url': input = `<input class="input" type="url" id="${id}" name="${f.key}" placeholder="https://" value="${h(v ?? '')}">`; break;
        case 'checkbox': input = `<input type="checkbox" id="${id}" name="${f.key}" ${v ? 'checked' : ''}>`; break;
        case 'select': case 'ref':
          input = `<select class="input" id="${id}" name="${f.key}"><option value="">— ${f.type === 'ref' ? 'Nenhum' : 'Selecione'} —</option>${opts().map(([k, l]) => `<option value="${h(k)}" ${String(v) === String(k) ? 'selected' : ''}>${h(l)}</option>`).join('')}</select>`; break;
        case 'refmulti': case 'multiselect': {
          const sel = new Set(v || []);
          input = `<div class="check-list" id="${id}" data-multi="${f.key}">${opts().map(([k, l]) => `<label><input type="checkbox" value="${h(k)}" ${sel.has(k) ? 'checked' : ''}> ${h(l)}</label>`).join('') || '<span class="xs subtle">Nenhum registro cadastrado.</span>'}</div>`; break;
        }
        case 'tags': {
          const sel = new Set(v || []);
          input = `<div class="check-list" id="${id}" data-multi="${f.key}">${opts().map(([k, l]) => `<label><input type="checkbox" value="${h(k)}" ${sel.has(k) ? 'checked' : ''}> ${h(l)}</label>`).join('')}</div>`; break;
        }
        case 'files': {
          pendingFiles[f.key] = [...(v || [])];
          input = `<div data-files="${f.key}"><div class="chips" data-file-list></div><input type="file" accept="image/*,application/pdf" multiple class="input" style="height:auto;padding:6px" id="${id}"><div class="help">Arquivos ficam salvos localmente no IndexedDB (máx. recomendado 2 MB cada).</div></div>`; break;
        }
        default: input = `<input class="input" type="text" id="${id}" name="${f.key}" value="${h(v ?? '')}">`;
      }
      html += f.type === 'checkbox'
        ? `<div class="${cls}">${input}<label for="${id}">${h(f.label)}</label></div>`
        : `<div class="${cls}"><label for="${id}">${h(f.label)}</label>${input}${f.help ? `<div class="help">${h(f.help)}</div>` : ''}</div>`;
    });
    if (withChangeContext) {
      html += `<div class="form-group-title">Registro da alteração (histórico)</div>
        <div class="field"><label for="chg-source">Fonte desta alteração</label><select class="input" id="chg-source"><option value="">— Não informada —</option>${Store.list('sources').map(s => `<option value="${h(s.id)}">${h(s.title)}</option>`).join('')}</select></div>
        <div class="field"><label for="chg-note">Observação da alteração</label><input class="input" id="chg-note" type="text"></div>`;
    }
    form.innerHTML = html;

    // Anexos
    const renderFiles = (wrap, key) => {
      const list = wrap.querySelector('[data-file-list]');
      list.innerHTML = pendingFiles[key].map(id => {
        const att = Store.get('attachments', id);
        return `<span class="chip" data-att="${h(id)}">${h(att ? att.name : id)} <button type="button" class="btn btn-ghost btn-sm" data-rm="${h(id)}" aria-label="Remover anexo">✕</button></span>`;
      }).join('');
      list.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { pendingFiles[key] = pendingFiles[key].filter(x => x !== b.dataset.rm); renderFiles(wrap, key); }));
    };
    form.querySelectorAll('[data-files]').forEach(wrap => {
      const key = wrap.dataset.files; renderFiles(wrap, key);
      wrap.querySelector('input[type=file]').addEventListener('change', async e => {
        for (const file of e.target.files) {
          if (file.size > 5 * 1024 * 1024) { UI.toast(`${file.name}: arquivo acima de 5 MB não foi anexado.`, 'error'); continue; }
          const dataUrl = await U.readFile(file, 'dataURL');
          const att = await Store.create('attachments', { name: file.name, mime: file.type, size: file.size, dataUrl });
          pendingFiles[key].push(att.id);
        }
        e.target.value = ''; renderFiles(wrap, key);
      });
    });

    /** Lê e valida. Retorna { ok, data, errors, ctx }. */
    const read = () => {
      const data = {}; const errors = [];
      schema.fields.forEach((f, i) => {
        if (f.group) return;
        const el = form.querySelector(`#f-${store}-${i}`); let v;
        if (f.type === 'checkbox') v = el.checked;
        else if (['refmulti', 'multiselect', 'tags'].includes(f.type)) v = [...el.querySelectorAll('input:checked')].map(x => x.value);
        else if (f.type === 'files') v = pendingFiles[f.key];
        else if (f.type === 'number') v = el.value === '' ? null : Number(el.value);
        else if (f.type === 'lines') v = U.lines(el.value).join('\n') || null;
        else v = el.value.trim() === '' ? null : el.value.trim();
        if (f.required && U.isEmpty(v)) errors.push(`${f.label} é obrigatório.`);
        if (f.type === 'ym' && v && !/^\d{4}(-\d{2})?$/.test(v)) errors.push(`${f.label}: use AAAA-MM ou AAAA.`);
        if (f.type === 'url' && v && !U.safeUrl(v)) errors.push(`${f.label}: URL inválida (use http/https).`);
        U.set(data, f.key, v);
      });
      const ctx = withChangeContext ? { sourceId: form.querySelector('#chg-source').value || null, note: form.querySelector('#chg-note').value || null } : {};
      return { ok: !errors.length, data, errors, ctx };
    };
    return { form, read };
  },

  /** Abre formulário de criação/edição de um registro. */
  openForm(store, record = null, { defaults = {}, onSaved, title } = {}) {
    const isEdit = !!(record && record.id);
    const base = isEdit ? record : { provenance: 'interno', verification: 'pendente', ...defaults };
    const { form, read } = UI.buildForm(store, base, { withChangeContext: isEdit });
    const m = UI.modal({
      title: title || `${isEdit ? 'Editar' : 'Novo'} ${STORE_LABELS[store] ? STORE_LABELS[store].toLowerCase() : 'registro'}`,
      body: form, size: 'lg',
      footer: `<span class="xs subtle" style="margin-right:auto">Campos vazios serão exibidos como "Não informado".</span><button class="btn" data-close>Cancelar</button><button class="btn btn-primary" data-save>Salvar</button>`
    });
    const save = async () => {
      const { ok, data, errors, ctx } = read();
      if (!ok) { UI.toast(errors[0], 'error'); return; }
      try {
        let saved;
        if (isEdit) {
          // preserva campos não presentes no formulário (ex.: geo de empreendimentos)
          const merged = U.clone(record); Object.entries(U.flatten(data)).forEach(([k, v]) => U.set(merged, k, v));
          saved = await Store.update(store, record.id, merged, ctx);
        } else {
          const fresh = store === 'developments' ? Object.assign(Schemas.devDefaults(), {}) : {};
          Object.entries(U.flatten(data)).forEach(([k, v]) => U.set(fresh, k, v));
          saved = await Store.create(store, { ...defaults, ...fresh });
        }

    const rows = () => {

      wrap.querySelector('tbody').innerHTML = list.length ? list.map(r => `<tr data-id="${h(r.id)}" class="${cfg.rowClass ? cfg.rowClass(r) : ''}">${cfg.columns.map(c => `<td class="${c.num ? 'num' : ''}">${c.render ? c.render(r) : U.show(cellText(r)(c))}</td>`).join('')}${cfg.store ? `<td class="actions">${(cfg.extraActions || []).map((a, i) => `<button class="btn btn-ghost btn-sm" data-extra="${i}" title="${h(a.label)}">${a.icon ? icon(a.icon) : h(a.label)}</button>`).join('')}<button class="btn btn-ghost btn-sm" data-edit title="Editar">${icon('edit')}</button><button class="btn btn-ghost btn-sm btn-danger" data-del title="Excluir">${icon('trash')}</button></td>` : ''}</tr>`).join('')
        : `<tr><td colspan="${cfg.columns.length + (cfg.store ? 1 : 0)}" class="muted" style="text-align:center;padding:28px">${h(cfg.emptyText || 'Nenhum registro encontrado.')}</td></tr>`;
      wrap.querySelector('[data-foot]').textContent = `${list.length} registro(s) exibido(s)${cfg.footNote ? ' · ' + cfg.footNote : ''}`;
      wrap.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => {
        const i = Number(th.dataset.sort); if (cfg.columns[i].sortable === false) return;
        state.dir = state.sort === i ? -state.dir : 1; state.sort = i; render();
      }));
      wrap.querySelectorAll('tbody tr[data-id]').forEach(tr => {
        const rec = list.find(r => r.id === tr.dataset.id);

        tr.querySelector('[data-del]')?.addEventListener('click', () => UI.deleteRecord(cfg.store, rec, refresh));
        tr.querySelectorAll('[data-extra]').forEach(b => b.addEventListener('click', () => cfg.extraActions[Number(b.dataset.extra)].run(rec, refresh)));

        if (cfg.onRowClick) tr.style.cursor = 'pointer';

    const refresh = () => { render(); cfg.onChange && cfg.onChange(); };
    wrap.querySelector('[data-q]').addEventListener('input', U.debounce(e => { state.q = e.target.value; render(); }, 150));
    wrap.querySelectorAll('[data-filter]').forEach(s => s.addEventListener('change', () => { state.filters[s.dataset.filter] = s.value; render(); }));

      const list = rows(); const cols = cfg.columns.map(c => c.label);

      U.download(`${cfg.csvName || cfg.store || 'tabela'}-${U.today()}.csv`, U.toCSV(data, cols), 'text/csv;charset=utf-8');
    });
    render();
    return { refresh: render };
  },

/* -----------------------------------------------------------------------
   Animações de entrada (fade-in + slide-up) com Motion
   Motion é a biblioteca JavaScript do Framer Motion (motion.dev): mesma
   engine, API sem React — `inView` dispara quando o card entra na tela e
   `animate` executa a transição. Sem a biblioteca, usa IntersectionObserver.
   ----------------------------------------------------------------------- */
const Reveal = {
  apply(root = document, selector = '.service-card, .reveal') {
    const els = [...root.querySelectorAll(selector)];
    if (!els.length) return;
    if (U.prefersReducedMotion()) { els.forEach(el => el.classList.remove('reveal-pending')); return; }
    els.forEach(el => el.classList.add('reveal-pending'));
    const M = window.Motion;
    if (M && M.inView && M.animate) {
      M.inView(els, ({ target }) => {
        const idx = Number(target.dataset.revealIndex || 0);
        target.classList.remove('reveal-pending');
        M.animate(target, { opacity: [0, 1], transform: ['translateY(28px)', 'translateY(0px)'] },
          { duration: 0.65, delay: (idx % 3) * 0.09, ease: [0.22, 1, 0.36, 1] });
      }, { amount: 0.2 });
      return;
    }
    // Fallback sem Motion: transição CSS acionada por IntersectionObserver
    const io = new IntersectionObserver(entries => entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target; const idx = Number(el.dataset.revealIndex || 0);
      el.style.transition = `opacity 650ms var(--ease-out) ${(idx % 3) * 90}ms, transform 650ms var(--ease-out) ${(idx % 3) * 90}ms`;
      el.classList.remove('reveal-pending'); io.unobserve(el);
    }), { threshold: 0.2 });
    els.forEach(el => io.observe(el));
  }
};

/* -----------------------------------------------------------------------
   9. RADAR COMPETITIVO (canvas)
   Varredura contínua: cada concorrente "acende" quando o feixe passa.
   Ângulo = posição ordinal (ilustrativa, NÃO geográfica).
   Raio   = métrica escolhida (distância ao metrô, preço "a partir de" ou
            prazo de entrega). Sem dado → anel externo tracejado.
   ----------------------------------------------------------------------- */
class Radar {
  constructor(canvas, { onContact, onClick, tipEl, period = 7000 } = {}) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d'); this.items = []; this.onContact = onContact; this.onClick = onClick;
    this.tipEl = tipEl; this.period = period; this.angle = -Math.PI / 2; this.lastT = null; this.raf = null; this.hover = null;
    this.center = { label: '' }; this.rings = [];
    this.reduced = U.prefersReducedMotion();
    this._resize = () => this.resize(); window.addEventListener('resize', this._resize);
    canvas.addEventListener('mousemove', e => this.handleHover(e));
    canvas.addEventListener('mouseleave', () => { this.hover = null; if (this.tipEl) this.tipEl.classList.add('hidden'); });
    canvas.addEventListener('click', e => { const it = this.hit(e); if (it && this.onClick) this.onClick(it); });
    this.resize();
  }
  /** items: [{ id, name, r: 0..1 | null, color, detail, group, hollow }] */
  setData({ items, center, rings, sectors }) {
    this.center = center || this.center; this.rings = rings || []; this.sectors = sectors || null;
    const n = items.length;
    this.items = items.map((it, i) => {
      let angle;
      if (this.sectors && it.sector !== undefined) {
        const sec = this.sectors[it.sector]; const inSec = items.filter(x => x.sector === it.sector); const j = inSec.indexOf(it);
        angle = sec.start + (sec.end - sec.start) * ((j + 0.5) / inSec.length);
      } else angle = -Math.PI / 2 + (2 * Math.PI * (i + 0.5)) / Math.max(n, 1);
      return { ...it, angle, glow: 0 };
    });
    this.draw();
  }
  resize() {
    const dpr = window.devicePixelRatio || 1; const rect = this.canvas.getBoundingClientRect();
    this.canvas.width = Math.max(1, rect.width * dpr); this.canvas.height = Math.max(1, rect.height * dpr);
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); this.w = rect.width; this.h = rect.height; this.draw();
  }
  geom() { const R = Math.min(this.w, this.h) / 2 - 26; return { cx: this.w / 2, cy: this.h / 2, R: Math.max(R, 10) }; }
  pos(it) {
    const { cx, cy, R } = this.geom(); const rr = it.r == null ? 1.0 : 0.12 + it.r * 0.76;
    return { x: cx + Math.cos(it.angle) * rr * R, y: cy + Math.sin(it.angle) * rr * R };
  }
  start() {
    if (this.reduced) { this.items.forEach(it => (it.glow = 0.6)); this.draw(); this.cycleStatic(); return; }
    const step = t => {
      if (this.lastT == null) this.lastT = t; const dt = t - this.lastT; this.lastT = t;
      const prev = this.angle; this.angle += (2 * Math.PI * dt) / this.period;
      this.items.forEach(it => {
        // detecta cruzamento do feixe com o item (ângulos normalizados)
        const norm = a => ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const a0 = norm(prev), a1 = norm(this.angle), ai = norm(it.angle);
        const crossed = a0 <= a1 ? (ai > a0 && ai <= a1) : (ai > a0 || ai <= a1);
        if (crossed) { it.glow = 1; this.onContact && this.onContact(it); }
        else it.glow = Math.max(0, it.glow - dt / (this.period * 0.85));
      });
      this.draw(); this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  /** Movimento reduzido: sem varredura; destaca um concorrente por vez, devagar. */
  cycleStatic() {
    let i = 0; const tick = () => { if (!this.items.length) return; const it = this.items[i % this.items.length]; this.onContact && this.onContact(it); i++; };
    tick(); this.timer = setInterval(tick, 4000);
  }
  stop() { cancelAnimationFrame(this.raf); clearInterval(this.timer); window.removeEventListener('resize', this._resize); }
  hit(e) {
    const rect = this.canvas.getBoundingClientRect(); const x = e.clientX - rect.left, y = e.clientY - rect.top;
    let best = null, bd = 14;
    this.items.forEach(it => { const p = this.pos(it); const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = it; } });
    return best;
  }
  handleHover(e) {
    const it = this.hit(e); this.hover = it; this.canvas.style.cursor = it ? 'pointer' : 'crosshair';
    if (!this.tipEl) return;
    if (!it) { this.tipEl.classList.add('hidden'); return; }
    const p = this.pos(it);
    this.tipEl.innerHTML = `<b>${h(it.name)}</b><br>${h(it.detail || '')}`;
    this.tipEl.style.left = `${Math.min(p.x + 14, this.w - 250)}px`; this.tipEl.style.top = `${p.y + 10}px`;
    this.tipEl.classList.remove('hidden'); if (this.reduced) this.draw();
  }
  draw() {
    const ctx = this.ctx; if (!ctx || !this.w) return; const { cx, cy, R } = this.geom();
    const ringC = U.cssVar('--radar-ring') || 'rgba(200,175,140,.18)', sweepC = U.cssVar('--radar-sweep') || 'rgba(200,160,110,.55)', txt = U.cssVar('--radar-text') || '#cbbfae';
    ctx.clearRect(0, 0, this.w, this.h);
    // setores (modo "todos os grupos")
    if (this.sectors) this.sectors.forEach(s => {
      ctx.strokeStyle = ringC; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(s.start) * R, cy + Math.sin(s.start) * R); ctx.stroke();
      const mid = (s.start + s.end) / 2; ctx.fillStyle = txt; ctx.font = '600 11px Inter, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(s.label.toUpperCase(), cx + Math.cos(mid) * (R + 14), cy + Math.sin(mid) * (R + 14) + 4);
    });
    // anéis
    ctx.lineWidth = 1;
    [0.12 + 0.76 * 0.25, 0.12 + 0.76 * 0.5, 0.12 + 0.76 * 0.75, 0.88].forEach(f => { ctx.strokeStyle = ringC; ctx.beginPath(); ctx.arc(cx, cy, R * f, 0, Math.PI * 2); ctx.stroke(); });
    ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    if (!this.sectors) { ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke(); }
    ctx.fillStyle = txt; ctx.font = '10px Inter, sans-serif'; ctx.textAlign = 'left';
    this.rings.forEach(rg => { const f = rg.r == null ? 1 : 0.12 + 0.76 * rg.r; ctx.fillText(rg.label, cx + 4, cy - R * f - 3); });
    // feixe de varredura
    if (!this.reduced) {
      const trail = Math.PI / 2.2;
      if (ctx.createConicGradient) {
        const g = ctx.createConicGradient(this.angle - trail, cx, cy);
        g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(trail / (2 * Math.PI), sweepC.replace(/[\d.]+\)$/, '0.28)')); g.addColorStop(trail / (2 * Math.PI) + 0.0001, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, this.angle - trail, this.angle); ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = sweepC; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(this.angle) * R, cy + Math.sin(this.angle) * R); ctx.stroke();
    }
    // centro
    ctx.fillStyle = '#a8835a'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(168,131,90,.45)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, 11, 0, Math.PI * 2); ctx.stroke();
    if (this.center.label) { ctx.fillStyle = '#f4f2ee'; ctx.font = '600 11px Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(this.center.label, cx, cy + 28); }
    // contatos
    this.items.forEach(it => {
      const p = this.pos(it); const g = Math.max(it.glow, this.hover === it ? 1 : 0);
      const base = it.color || '#c9a77c';
      if (g > 0.02) { ctx.fillStyle = base; ctx.globalAlpha = 0.25 * g; ctx.beginPath(); ctx.arc(p.x, p.y, 8 + 10 * g, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 0.35 + 0.65 * g;
      ctx.lineWidth = 2; ctx.strokeStyle = base; ctx.fillStyle = base; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      if (it.hollow) ctx.stroke(); else ctx.fill();
      if (g > 0.15) {
        ctx.globalAlpha = Math.min(1, g * 1.2); ctx.fillStyle = '#f4f2ee'; ctx.font = '600 11px Inter, sans-serif';
        // rótulo para o lado com espaço disponível (evita corte nas bordas)
        const tw = ctx.measureText(it.name).width; let right = p.x > cx;
        if (right && p.x + 10 + tw > this.w - 4) right = false; else if (!right && p.x - 10 - tw < 4) right = true;
        ctx.textAlign = right ? 'left' : 'right'; ctx.fillText(it.name, p.x + (right ? 10 : -10), p.y + 4);
      }
      ctx.globalAlpha = 1;
    });
  }
}
