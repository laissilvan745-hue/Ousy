      <div class="radar-panel">
        <div class="card radar-contact" aria-live="polite"><div class="xs subtle">Aguardando varredura…</div></div>
        <div class="card" style="padding:var(--space-3)">
          <div class="card-sub" style="padding:0 var(--space-2) var(--space-2)">Concorrentes no radar</div>
          <ul class="list radar-list"></ul>
        </div>
        <div class="radar-legend">${Object.entries(RADAR_COLORS).map(([k, c]) => `<span><span class="legend-swatch" style="background:${c}"></span>${h(k)}</span>`).join('')}<span><span class="legend-swatch" style="border:2px solid #a7acb4;background:transparent"></span>Sem dado numérico</span></div>
        <p class="xs subtle" data-note></p>
      </div>
    </div>`;
  const canvas = container.querySelector('canvas'); const tip = container.querySelector('.radar-tip');
  const contactEl = container.querySelector('.radar-contact'); const listEl = container.querySelector('.radar-list');
  const noteEl = container.querySelector('[data-note]');
  let lastContact = 0;
  const radar = new Radar(canvas, {
    tipEl: tip,
    onClick: it => { location.hash = `#/ficha/${it.id}`; },
    onContact: it => {
      const now = performance.now(); if (now - lastContact < 250) return; lastContact = now;
      const d = Store.get('developments', it.id); if (!d) return;
      const sp = A.startingPrice(d); const near = A.nearest(d);
      contactEl.innerHTML = `
        <div class="xs subtle" style="text-transform:uppercase;letter-spacing:.08em">Contato · ${h(A.groupName(d))}</div>
        <div class="name" style="margin:6px 0 4px">${h(d.name)}</div>
        <div class="small muted">${U.show(A.companiesText(d))}</div>
        <dl class="dl compact" style="margin-top:var(--space-3)">
          <dt>Metrô</dt><dd>${U.show(A.distanceText(near))}</dd>
          <dt>Preço</dt><dd>${sp ? `${h(ENUMS.priceType[sp.priceType])} ${h(U.brl(sp.value))}` : U.NA}</dd>
          <dt>Metragem</dt><dd>${U.show(A.areaText(d))}</dd>
          <dt>Entrega</dt><dd>${U.show(A.deliveryText(d))}</dd>
          <dt>Estágio</dt><dd>${UI.stage(d)}</dd>
        </dl>
        <a class="small" href="#/ficha/${h(d.id)}" style="display:inline-block;margin-top:var(--space-3)">Abrir ficha →</a>`;
      listEl.querySelectorAll('li').forEach(li => li.classList.toggle('lit', li.dataset.id === it.id));
      const lit = listEl.querySelector('li.lit');
      // rola apenas a lista (não a página) para manter o contato visível
      if (lit && !compact) { const top = lit.offsetTop - listEl.offsetTop; if (top < listEl.scrollTop || top > listEl.scrollTop + listEl.clientHeight - lit.offsetHeight) listEl.scrollTop = top - 8; }
    }
  });
  const build = () => {
    container.querySelectorAll('[data-group]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.group === RadarState.group)));
    container.querySelector('[data-metric]').value = RadarState.metric;
    const groups = RadarState.group === 'all' ? A.ousy() : A.ousy().filter(o => o.id === RadarState.group);
    const comps = groups.flatMap((g, gi) => A.competitors(g.id).map(d => ({ d, sector: gi })));
    const metricVal = d => {
      if (RadarState.metric === 'metro') { const p = A.proximities(d.id).find(x => x.distanceM != null); return p ? p.distanceM : null; }
      if (RadarState.metric === 'price') { const sp = A.startingPrice(d); return sp ? sp.value : null; }
      const dl = A.delivery(d); if (!dl) return null; return dl.kind === 'actual' ? 0 : Math.max(0, A.monthsToDelivery(d));
    };
    const vals = comps.map(c => metricVal(c.d)).filter(v => v != null);
    let min = 0, max = 1, rings = [], note = '';
    if (RadarState.metric === 'metro') {
      max = 1000; rings = [250, 500, 750, 1000].map(v => ({ r: v / max, label: `${U.num(v)} m` }));
      note = 'Raio = distância até o metrô conforme informado na fonte (aproximada). O ângulo é apenas ilustrativo e não representa direção geográfica.';
    } else if (RadarState.metric === 'price') {
      min = vals.length ? Math.min(...vals) : 0; max = vals.length ? Math.max(...vals) : 1; if (max === min) max = min + 1;
      rings = [0, 0.5, 1].map(f => ({ r: f, label: U.brl(min + (max - min) * f) }));
      note = 'Raio = preço "a partir de" anunciado (menor no centro). Não é preço médio nem preço negociado. Ângulo ilustrativo.';
    } else {
      max = vals.length ? Math.max(...vals, 12) : 12;
      rings = [0, 0.5, 1].map(f => ({ r: f, label: `${Math.round(max * f)} meses` }));
      note = 'Raio = meses até a entrega prevista (centro = pronto/entregue). Ângulo ilustrativo.';
    }
    const items = comps.map(({ d, sector }) => {
      const v = metricVal(d); const near = A.nearest(d);
      return {
        id: d.id, name: d.name, sector, color: RADAR_COLORS[A.stageBucket(d)],
        r: v == null ? null : Math.min(1, Math.max(0, (v - min) / (max - min))), hollow: v == null,
        detail: [A.companiesText(d), A.distanceText(near), (() => { const sp = A.startingPrice(d); return sp ? `${ENUMS.priceType[sp.priceType]} ${U.brl(sp.value)}` : 'Preço não informado'; })(), A.deliveryText(d)].filter(Boolean).join(' · ')
      };
    });
    const sectors = RadarState.group === 'all' ? groups.map((g, i) => ({ label: g.name.replace('The One ', ''), start: -Math.PI / 2 + (i * 2 * Math.PI) / groups.length, end: -Math.PI / 2 + ((i + 1) * 2 * Math.PI) / groups.length })) : null;
    radar.setData({ items, rings: [...rings, { r: null, label: 'sem dado' }], sectors, center: { label: RadarState.group === 'all' ? 'Ousy' : groups[0].name } });
    listEl.innerHTML = items.map(it => `<li data-id="${h(it.id)}"><span>${h(it.name)}</span><span class="xs subtle">${h(A.groupName(Store.get('developments', it.id)).replace('The One ', ''))}</span></li>`).join('') || '<li class="muted">Nenhum concorrente cadastrado.</li>';
    listEl.querySelectorAll('li[data-id]').forEach(li => li.addEventListener('click', () => { location.hash = `#/ficha/${li.dataset.id}`; }));
    noteEl.textContent = `${note} ${items.length} concorrentes · ${items.filter(i => i.hollow).length} sem dado numérico.`;
  };
  container.querySelectorAll('[data-group]').forEach(b => b.addEventListener('click', () => { RadarState.group = b.dataset.group; build(); }));
  container.querySelector('[data-metric]').addEventListener('change', e => { RadarState.metric = e.target.value; build(); });
  build(); radar.resize(); radar.start();
  return () => radar.stop();
}

      { label: 'Prevista', data: dl.filter(p => p.kind === 'forecast').map(p => ({ x: p.x, y: p.d.name, ym: p.ym })), backgroundColor: pal[1], pointRadius: 6 },
      { label: 'Entregue (informado)', data: dl.filter(p => p.kind === 'actual').map(p => ({ x: p.x, y: p.d.name, ym: p.ym })), backgroundColor: pal[3], pointRadius: 6, pointStyle: 'rectRot' },
      { label: 'Hoje', data: dl.length ? [{ x: nowX, y: dl[0].d.name }, { x: nowX, y: dl[dl.length - 1].d.name }] : [], type: 'line', borderColor: pal[4], borderDash: [4, 4], pointRadius: 0, borderWidth: 1.5 }
    ] },
    options: { plugins: { tooltip: { callbacks: { label: c => `${c.raw.y}: ${c.raw.ym ? U.ym(c.raw.ym) : 'hoje'}` } } }, scales: { x: { type: 'linear', ticks: { stepSize: 1, callback: v => Number.isInteger(v) ? v : '' } }, y: { type: 'category', labels: dl.map(p => p.d.name), grid: { display: false } } } }
  }, { isEmpty: !dl.length });
  // Gráfico 4: evolução dos preços
  const series = Object.values(A.priceSeries());
  const tsOf = s => new Date(s + 'T12:00:00').getTime();
  UI.chart(el.querySelector('[data-c4]'), {
    type: 'line',
    data: { datasets: series.map((s, i) => ({ label: `${Schemas.devName(s[0].developmentId)} · ${s[0].typologyLabel}`, data: s.map(p => ({ x: tsOf(p.collectedAt), y: p.value })), borderColor: pal[i % pal.length], backgroundColor: pal[i % pal.length], tension: 0.2, pointRadius: 3 })) },
    options: { plugins: { legend: { display: series.length <= 8, position: 'bottom' }, tooltip: { callbacks: { title: c => U.date(new Date(c[0].raw.x).toISOString()), label: c => `${c.dataset.label}: ${U.brl(c.raw.y)}` } } }, scales: { x: { type: 'linear', ticks: { maxTicksLimit: 6, callback: v => U.date(new Date(v).toISOString()) } }, y: { ticks: { callback: v => U.brl(v) } } } }
  }, { isEmpty: !series.length });

  UI.crudTable(el.querySelector('[data-t1]'), {
    rows: () => comps, csvName: 'ultima-atualizacao',
    columns: [
      { label: 'Concorrente', key: 'name', render: d => `<a href="#/ficha/${h(d.id)}">${h(d.name)}</a>` },
      { label: 'Grupo Ousy', text: d => A.groupName(d), render: d => h(A.groupName(d)) },
      { label: 'Última atualização (sistema)', text: d => A.lastUpdate(d), render: d => h(U.dateTime(A.lastUpdate(d)) || '—') },
      { label: 'Referência do dado', text: d => d.lastVerifiedAt || d.referenceDate, render: d => U.show(U.date(d.lastVerifiedAt || d.referenceDate)) },
      { label: 'Verificação', text: d => ENUMS.verification[d.verification], render: d => UI.govBadges(d) },
      { label: 'Lacunas', text: d => A.gaps(d).join(', '), render: d => A.gaps(d).length ? `<span class="small muted">${h(A.gaps(d).join(', '))}</span>` : '<span class="badge pos">Completo</span>' }
    ],
    onRowClick: d => { location.hash = `#/ficha/${d.id}`; }
  });
};

/* ======================= MÓDULO 2 — EMPREENDIMENTOS ======================= */
const DevState = { mode: 'cards' };

function devCard(d) {
  const sp = A.startingPrice(d); const near = A.nearest(d);
  return `<div class="card dev-card ${d.isOusy ? 'ousy-ref' : ''}" data-dev="${h(d.id)}" tabindex="0" role="link" aria-label="Abrir ficha de ${h(d.name)}">
    <div class="row-between"><div class="name">${h(d.name)}</div>${d.isOusy ? '<span class="badge accent">Ousy</span>' : UI.stage(d)}</div>
    <div class="meta">${U.show(A.companiesText(d))}</div>
    <div class="meta small">${U.show(A.addressText(d))}</div>
    <div class="facts">
      <div><span>Metrô</span>${U.show(A.distanceText(near))}</div>
      <div><span>Metragem</span>${U.show(A.areaText(d))}</div>
      <div><span>Preço</span>${sp ? `<span class="xs subtle" style="display:inline">${h(ENUMS.priceType[sp.priceType])}</span> ${h(U.brl(sp.value))}` : U.NA}</div>
      <div><span>Entrega</span>${U.show(A.deliveryText(d))}</div>
    </div>
    <div class="row xs">${UI.govBadges(d)}</div>
  </div>`;
}

Views.empreendimentos = (el, params) => {
  const ousy = A.ousy(); const sel = params[0] && Store.get('developments', params[0]) ? params[0] : (ousy[0] ? ousy[0].id : null);
  const render = () => {
    const ref = Store.get('developments', sel); const comps = A.competitors(sel);
    el.innerHTML = pageHead('Módulo 02', 'Monitoramento de empreendimentos',
      'Selecione um empreendimento da Ousy para ver somente seus concorrentes associados. Informações indisponíveis aparecem como "Não informado" — nunca são preenchidas por suposição.',
      `<button class="btn" data-mode>${DevState.mode === 'cards' ? 'Ver em tabela' : 'Ver em cartões'}</button><button class="btn btn-primary" data-new>${icon('plus')} Novo concorrente</button>`) + `
      <div class="tabs" role="tablist">${ousy.map(o => `<button class="tab" role="tab" aria-selected="${o.id === sel}" data-tab="${h(o.id)}">${h(o.name)}<span class="count">${A.competitors(o.id).length}</span></button>`).join('')}
        <button class="tab" role="tab" aria-selected="${sel === '__all'}" data-tab="__all">Todos os registros<span class="count">${A.devs().length}</span></button></div>
      <div data-body></div>`;
    const body = el.querySelector('[data-body]');
    if (DevState.mode === 'table' || sel === '__all') {
      UI.crudTable(body, {
        store: 'developments', rows: () => sel === '__all' ? A.devs() : [ref, ...A.competitors(sel)].filter(Boolean), csvName: 'empreendimentos',
        defaults: () => ({ ousyRefId: sel !== '__all' ? sel : null }),
        rowClass: d => d.isOusy ? 'row-ousy' : '',
        filters: [
          { label: 'Estágio', options: () => Object.entries(ENUMS.stage), match: (d, v) => d.stage === v },
          { label: 'Verificação', options: () => Object.entries(ENUMS.verification), match: (d, v) => d.verification === v }
        ],
        columns: [
          { label: 'Empreendimento', key: 'name', render: d => `<a href="#/ficha/${h(d.id)}">${h(d.name)}</a>` },
          { label: 'Incorporadora', text: d => A.companiesText(d), render: d => U.show(A.companiesText(d)) },
          { label: 'Endereço', text: d => A.addressText(d), render: d => U.show(A.addressText(d)) },
          { label: 'Metrô', text: d => A.distanceText(A.nearest(d)), sortVal: d => (A.nearest(d) || {}).distanceM, render: d => U.show(A.distanceText(A.nearest(d))) },
          { label: 'Metragem', text: d => A.areaText(d), sortVal: d => d.areaMin, render: d => U.show(A.areaText(d)) },
          { label: 'Preço inicial', num: true, text: d => (A.startingPrice(d) || {}).value, sortVal: d => (A.startingPrice(d) || {}).value, render: d => { const p = A.startingPrice(d); return p ? `<span class="xs subtle">${h(ENUMS.priceType[p.priceType])}</span> ${h(U.brl(p.value))}` : U.NA; } },
          { label: 'Entrega', text: d => A.deliveryText(d), sortVal: d => (A.delivery(d) || {}).date?.getTime(), render: d => U.show(A.deliveryText(d)) },
          { label: 'Estágio', text: d => ENUMS.stage[d.stage], render: d => UI.stage(d) },
          { label: 'Unidades', num: true, key: 'units', render: d => U.show(d.units, U.num) },
          { label: 'Dado', text: d => ENUMS.provenance[d.provenance], render: d => UI.govBadges(d) }
        ],
        onRowClick: d => { location.hash = `#/ficha/${d.id}`; }, onChange: render
      });
    } else {
      body.innerHTML = `
        ${ref ? `<div class="section-title">Empreendimento de referência</div><div class="grid g-auto">${devCard(ref)}</div>` : ''}
        <div class="section"><div class="section-title">Concorrentes associados <span class="muted">${comps.length} registro(s)</span></div>
        <div class="grid g-auto">${comps.map(devCard).join('') || '<p class="muted">Nenhum concorrente associado.</p>'}</div></div>`;
      body.querySelectorAll('[data-dev]').forEach(c => {
        const go = () => { location.hash = `#/ficha/${c.dataset.dev}`; };
        c.addEventListener('click', go); c.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      });
    }
    el.querySelectorAll('[data-tab]').forEach(t => t.addEventListener('click', () => { location.hash = `#/empreendimentos/${t.dataset.tab}`; }));
    el.querySelector('[data-mode]').addEventListener('click', () => { DevState.mode = DevState.mode === 'cards' ? 'table' : 'cards'; render(); });
    el.querySelector('[data-new]').addEventListener('click', () => UI.openForm('developments', null, { defaults: { ousyRefId: sel !== '__all' ? sel : null }, onSaved: d => { location.hash = `#/ficha/${d.id}`; } }));
  };
  render();
};

/* ---------- Ficha detalhada ---------- */

        <div class="card"><div class="card-title" style="margin-bottom:var(--space-3)">Presença digital</div>
          <dl class="dl">
            <dt>Site oficial</dt><dd>${L.site ? U.link(L.site) : U.NA}</dd>

            <dt>Última verificação</dt><dd>${U.show(d.lastVerifiedAt, U.date)}</dd>

    el.querySelector('[data-edit]').addEventListener('click', () => UI.openForm('developments', d, { onSaved: render }));
    el.querySelector('[data-del]').addEventListener('click', () => UI.deleteRecord('developments', d, () => { location.hash = '#/empreendimentos'; }));

      ], onChange: render
    });
    UI.crudTable(el.querySelector('[data-typ]'), {
      store: 'typologies', rows: () => Store.byDev('typologies', d.id), defaults: () => ({ developmentId: d.id }), addLabel: 'Adicionar tipologia', csvName: `tipologias-${d.id}`,
      columns: [
        { label: 'Tipo', text: t => ENUMS.typologyKind[t.kind], render: t => h(ENUMS.typologyKind[t.kind] || t.kind) },

        { label: 'Mín. (m²)', num: true, key: 'areaMin', render: t => U.show(t.areaMin, v => U.num(v, 1)) },
        { label: 'Máx. (m²)', num: true, key: 'areaMax', render: t => U.show(t.areaMax, v => U.num(v, 1)) },
        { label: 'Unidades', num: true, key: 'unitsCount', render: t => U.show(t.unitsCount, U.num) },
        { label: 'Dado', render: t => UI.govBadges(t), sortable: false }
      ], onChange: render
    });
  };
  render();
};

function logItem(l) {
  const src = l.sourceId && Store.get('sources', l.sourceId);
  const fmt = v => h(Schemas.display(l.entity, l.field, v));
  const body = l.field.startsWith('(')
    ? `<div>${h(l.fieldLabel || l.field)}${l.newValue ? `: <span class="diff-new">${h(typeof l.newValue === 'string' ? l.newValue : '')}</span>` : ''}${l.oldValue && l.field === '(registro excluído)' ? `: <span class="diff-old">${h(l.oldValue)}</span>` : ''}</div>`
    : `<div><b>${h(l.fieldLabel || l.field)}</b>: <span class="diff-old">${fmt(l.oldValue)}</span> → <span class="diff-new">${fmt(l.newValue)}</span></div>`;
  return `<li><div class="when">${h(U.dateTime(l.at))} · ${h(STORE_LABELS[l.entity] || l.entity)} · ${l.developmentId ? `<a href="#/ficha/${h(l.developmentId)}">${h(Schemas.devName(l.developmentId))}</a>` : h(l.entityTitle || '')}</div>${body}
    <div class="xs subtle">${l.user ? `Responsável: ${h(l.user)} · ` : ''}${src ? `Fonte: ${h(src.title)} · ` : ''}${l.note ? h(l.note) : ''}</div></li>`;
}

/* ======================= MÓDULO 3 — COMPARATIVO ======================= */
const CompareState = { ids: [], cross: false };

Views.comparativo = (el, params, query) => {
  if (query.ids) { CompareState.ids = query.ids.split(',').filter(id => Store.get('developments', id)).slice(0, 5); }
  if (!CompareState.ids.length) { const o = A.ousy()[0]; if (o) CompareState.ids = [o.id, ...A.competitors(o.id).slice(0, 2).map(d => d.id)]; }
  const render = () => {
    const sel = CompareState.ids.map(id => Store.get('developments', id)).filter(Boolean);
    const groupsSel = new Set(sel.map(d => (A.groupOf(d) || {}).id));
    el.innerHTML = pageHead('Módulo 03', 'Comparativo competitivo',
      'Selecione de 2 a 5 empreendimentos. Os concorrentes estão agrupados pelo empreendimento Ousy de referência. A ferramenta indica quando a comparação é direta ou envolve produtos com tipologias, metragens ou estágios distintos.') + `
      <div class="card no-print">
        <div class="row-between" style="margin-bottom:var(--space-3)"><div class="card-title">Seleção (${sel.length}/5)</div>
          <label class="small row"><input type="checkbox" data-cross ${CompareState.cross ? 'checked' : ''}> Permitir comparação entre regiões/grupos diferentes</label></div>
        ${A.ousy().map(o => `<div style="margin-bottom:var(--space-3)"><div class="xs subtle" style="margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em">${h(o.name)}</div><div class="chips">
          ${[o, ...A.competitors(o.id)].map(d => `<button class="chip" aria-pressed="${CompareState.ids.includes(d.id)}" data-pick="${h(d.id)}">${h(d.name)}</button>`).join('')}</div></div>`).join('')}
      </div>
      <div data-out></div>`;
    el.querySelector('[data-cross]').addEventListener('change', e => { CompareState.cross = e.target.checked; render(); });
    el.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.pick; const d = Store.get('developments', id);
      if (CompareState.ids.includes(id)) { CompareState.ids = CompareState.ids.filter(x => x !== id); return render(); }
      if (CompareState.ids.length >= 5) return UI.toast('Máximo de 5 empreendimentos por comparação.', 'error');
      const g = (A.groupOf(d) || {}).id;
      if (!CompareState.cross && CompareState.ids.length && !groupsSel.has(g)) return UI.toast('Este empreendimento pertence a outro grupo. Ative "Permitir comparação entre regiões" para incluí-lo.', 'error');
      CompareState.ids.push(id); render();
    }));
    const out = el.querySelector('[data-out]');
    if (sel.length < 2) { out.innerHTML = '<div class="callout neutral section">Selecione pelo menos 2 empreendimentos para comparar.</div>'; return; }
    const base = sel.find(d => d.isOusy) || sel[0];
    const comps = sel.filter(d => d !== base).map(d => ({ d, c: A.comparability(base, d) }));
    const argsOf = d => { const c = A.argCounts([d.id]); return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, n]) => `${ENUMS.argTags[k] || k} (${n})`).join(', '); };
    const rowsDef = [
      ['Grupo de referência', d => h(A.groupName(d))],
      ['Incorporadora', d => U.show(A.companiesText(d))],
      ['Localização', d => U.show(A.addressText(d))],
      ['Distância até o metrô', d => { const p = A.proximities(d.id); return p.length ? p.map(x => h(A.distanceText(x))).join('<br>') : U.NA; }],
      ['Metragens', d => U.show(A.areaText(d))],
      ['Tipologias', d => U.show(d.typologiesText)],
      ['Preço anunciado', d => { const p = A.startingPrice(d); return p ? `${h(U.brl(p.value))} <span class="xs subtle">${h(ENUMS.priceType[p.priceType])}</span>` : U.NA; }],
      ['Preço por m² verificável', d => { const l = A.latestPrices(d.id).filter(A.ppm2); return l.length ? l.map(p => `${h(U.brl(A.ppm2(p)))}/m² <span class="xs subtle">${h(p.typologyLabel)}</span>`).join('<br>') : '<span class="na">Não calculável</span>'; }],
      ['Previsão / entrega', d => U.show(A.deliveryText(d))],
      ['Estágio da obra', d => UI.stage(d)],
      ['Número de unidades', d => U.show(d.units, U.num)],
      ['Diferenciais', d => U.show(d.differentials)],
      ['Proposta comercial', d => U.show(d.commercialConditions || d.housingProgram)],
      ['Comunicação digital', d => { const n = Store.byDev('ads', d.id).length, p = Store.byDev('socialPosts', d.id).length, a = Store.byDev('seoAudits', d.id).length; return (n + p + a) ? `${n} anúncio(s) · ${p} post(s) · ${a} auditoria(s)<div class="xs subtle">${h(argsOf(d))}</div>` : U.NA; }],
      ['Posicionamento percebido', d => d.positioning ? `${h(d.positioning)} <div class="xs subtle">Registro analítico</div>` : U.NA],
      ['Dado / verificação', d => UI.govBadges(d)]
    ];
    out.innerHTML = `
      <div class="section"><div class="section-title">Natureza da comparação <span class="muted">referência: ${h(base.name)}</span></div>
        <div class="grid g-auto">${comps.map(({ d, c }) => `<div class="card flat"><div class="row-between"><b>${h(d.name)}</b>${c.direct ? '<span class="badge pos">Comparação direta</span>' : '<span class="badge warn">Comparação não direta</span>'}</div>
          <p class="small muted" style="margin-top:6px">${c.direct ? 'Mesmo grupo, metragens sobrepostas, tipologias em comum e estágio compatível.' : 'Atenção: ' + h(c.reasons.join('; ')) + '.'}</p></div>`).join('')}</div></div>
      <div class="section"><div class="row-between" style="margin-bottom:var(--space-3)"><div class="section-title" style="margin:0">Tabela comparativa</div><button class="btn btn-sm" data-csv>${icon('download')} CSV</button></div>
        <div class="table-wrap"><table class="data compare"><thead><tr><th scope="col">Critério</th>${sel.map(d => `<th scope="col" class="${d.isOusy ? 'row-ousy' : ''}"><a href="#/ficha/${h(d.id)}">${h(d.name)}</a></th>`).join('')}</tr></thead>
        <tbody>${rowsDef.map(([label, fn]) => `<tr><th scope="row">${h(label)}</th>${sel.map(d => `<td>${fn(d)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
      <div class="grid g-2 section">
        <div class="card"><div class="card-title">Preço anunciado ("a partir de")</div><div class="card-sub">Valores sem preço permanecem fora do gráfico</div><div class="chart-box" data-g1></div></div>
        <div class="card"><div class="card-title">Faixa de metragem (m²)</div><div class="card-sub">Mínima a máxima divulgadas</div><div class="chart-box" data-g2></div></div>
        <div class="card"><div class="card-title">Distância informada até o metrô (m)</div><div class="card-sub">Aproximações da fonte; sem número = fora do gráfico</div><div class="chart-box" data-g3></div></div>
        <div class="card"><div class="card-title">Meses até a entrega prevista</div><div class="card-sub">0 = pronto/entregue (informado)</div><div class="chart-box" data-g4></div></div>
      </div>
      <div class="callout neutral section">Esta ferramenta não classifica "melhor investimento". Uma classificação exigiria metodologia definida (ex.: preço efetivo negociado, liquidez, velocidade de vendas) e evidências que não constam da base atual.</div>`;
    const pal = UI.palette(); const colors = sel.map(d => d.isOusy ? pal[1] : pal[0]);
    const names = sel.map(d => d.name);
    const pr = sel.map(d => (A.startingPrice(d) || {}).value ?? null);
    UI.chart(out.querySelector('[data-g1]'), { type: 'bar', data: { labels: names, datasets: [{ label: 'R$', data: pr, backgroundColor: colors, borderRadius: 4 }] }, options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => U.brl(c.raw) } } }, scales: { y: { ticks: { callback: v => U.brl(v) } }, x: { grid: { display: false } } } } }, { isEmpty: pr.every(v => v == null), emptyText: 'Nenhum dos selecionados possui preço registrado.' });
    const ar = sel.map(d => d.areaMin != null ? [d.areaMin, d.areaMax ?? d.areaMin] : null);
    UI.chart(out.querySelector('[data-g2]'), { type: 'bar', data: { labels: names, datasets: [{ label: 'm²', data: ar, backgroundColor: colors, borderRadius: 4, borderSkipped: false }] }, options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.raw ? `${U.num(c.raw[0], 1)} – ${U.num(c.raw[1], 1)} m²` : '' } } }, scales: { x: { grid: { display: false } } } } }, { isEmpty: ar.every(v => v == null) });
    const di = sel.map(d => { const p = A.proximities(d.id).find(x => x.distanceM != null); return p ? p.distanceM : null; });
    UI.chart(out.querySelector('[data-g3]'), { type: 'bar', data: { labels: names, datasets: [{ label: 'm', data: di, backgroundColor: colors, borderRadius: 4 }] }, options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } } } } }, { isEmpty: di.every(v => v == null), emptyText: 'Sem distâncias numéricas para os selecionados.' });
    const mo = sel.map(d => { const x = A.delivery(d); if (!x) return null; return x.kind === 'actual' ? 0 : Math.max(0, A.monthsToDelivery(d)); });
    UI.chart(out.querySelector('[data-g4]'), { type: 'bar', data: { labels: names, datasets: [{ label: 'meses', data: mo, backgroundColor: colors, borderRadius: 4 }] }, options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } } } } }, { isEmpty: mo.every(v => v == null) });
    out.querySelector('[data-csv]').addEventListener('click', () => {
      const tmp = document.createElement('div');
      const rows = rowsDef.map(([label, fn]) => Object.fromEntries([['Critério', label], ...sel.map(d => { tmp.innerHTML = fn(d).replace(/<br>/g, ' | '); return [d.name, tmp.textContent.trim()]; })]));
      U.download(`comparativo-${U.today()}.csv`, U.toCSV(rows, ['Critério', ...names]), 'text/csv;charset=utf-8');
    });
  };
  render();
};

/* ======================= MÓDULO 4 — PREÇOS ======================= */
const PriceState = { group: '', dev: '' };

Views.precos = (el) => {
  const render = () => {
    const devFilter = d => (!PriceState.group || (A.groupOf(d) || {}).id === PriceState.group) && (!PriceState.dev || d.id === PriceState.dev);
    const devIds = new Set(A.devs().filter(devFilter).map(d => d.id));
    const prices = Store.list('prices').filter(p => devIds.has(p.developmentId));
    const series = Object.values(A.priceSeries()).filter(s => devIds.has(s[0].developmentId));
    const changes = A.priceChanges().filter(c => devIds.has(c.dev.id));
    const promos = prices.filter(p => p.isPromo || p.priceType === 'promocional');
    const prevOf = p => { const s = A.priceSeries()[A.priceKey(p)] || []; const i = s.findIndex(x => x.id === p.id); return i > 0 ? s[i - 1] : null; };
    el.innerHTML = pageHead('Módulo 04', 'Inteligência de preços',
      'Central de preços <b>anunciados</b> por empreendimento, tipologia e unidade. Um preço "a partir de" nunca é tratado como preço médio nem associado a uma metragem sem que a fonte o faça. Preço anunciado não é preço negociado.',
      `<button class="btn btn-primary" data-new>${icon('plus')} Registrar coleta de preço</button>`) + `
      <div class="row no-print" style="margin-bottom:var(--space-4)">
        <select class="input" style="width:auto" data-g><option value="">Todos os grupos</option>${A.ousy().map(o => `<option value="${h(o.id)}" ${PriceState.group === o.id ? 'selected' : ''}>${h(o.name)}</option>`).join('')}</select>
        <select class="input" style="width:auto" data-d><option value="">Todos os empreendimentos</option>${A.devs().filter(d => !PriceState.group || (A.groupOf(d) || {}).id === PriceState.group).map(d => `<option value="${h(d.id)}" ${PriceState.dev === d.id ? 'selected' : ''}>${h(d.name)}</option>`).join('')}</select>
      </div>
      <div class="grid g-4">
        <div class="card kpi"><div class="kpi-label">Coletas registradas</div><div class="kpi-value">${prices.length}</div><div class="kpi-meta">${series.length} série(s) de preço</div></div>
        <div class="card kpi"><div class="kpi-label">Aumentos</div><div class="kpi-value"><span class="trend up">${changes.filter(c => c.diff > 0).length}</span></div><div class="kpi-meta">Entre as duas últimas coletas de cada série</div></div>
        <div class="card kpi"><div class="kpi-label">Reduções</div><div class="kpi-value"><span class="trend down">${changes.filter(c => c.diff < 0).length}</span></div><div class="kpi-meta">Entre as duas últimas coletas de cada série</div></div>
        <div class="card kpi"><div class="kpi-label">Promoções / condições</div><div class="kpi-value">${promos.length}</div><div class="kpi-meta">${Store.list('campaigns').filter(c => devIds.has(c.developmentId)).length} campanha(s) registrada(s)</div></div>
      </div>
      <div class="grid g-2 section">
        <div class="card"><div class="card-title">Evolução mensal dos preços</div><div class="card-sub">Última coleta de cada mês por série · ${prices.length} coletas</div><div class="chart-box tall" data-ev></div></div>
        <div class="card"><div class="card-title">R$/m² entre unidades comparáveis</div><div class="card-sub">Somente preços vinculados a metragem pela fonte · ${prices.filter(A.ppm2).length} registro(s)</div><div class="chart-box tall" data-ppm></div></div>
      </div>
      <div class="section"><div class="section-title">Variações identificadas</div>
        <div class="card">${changes.length ? `<table class="data"><thead><tr><th>Empreendimento</th><th>Série</th><th class="num">Anterior</th><th class="num">Atual</th><th class="num">Variação</th><th>Período</th></tr></thead><tbody>${changes.map(c => `<tr><td><a href="#/ficha/${h(c.dev.id)}">${h(c.dev.name)}</a></td><td>${h(c.curr.typologyLabel)} <span class="xs subtle">${h(ENUMS.priceType[c.curr.priceType])}</span></td><td class="num">${h(U.brl(c.prev.value))}</td><td class="num">${h(U.brl(c.curr.value))}</td><td class="num">${UI.trend(c.pct)} <span class="xs subtle">${h(U.brl(c.diff))}</span></td><td>${h(U.date(c.prev.collectedAt))} → ${h(U.date(c.curr.collectedAt))}</td></tr>`).join('')}</tbody></table>`
          : '<p class="small muted">Nenhuma variação. Para acompanhar, registre novas coletas usando a mesma tipologia/descrição e o mesmo tipo de preço.</p>'}</div></div>
      <div class="section"><div class="section-title">Comparação dentro do mesmo bairro / grupo</div><div data-nb></div>
        <p class="table-foot">Bairro conforme informado na ficha. Sem bairro informado, o agrupamento usa o grupo Ousy de referência. Estatísticas sobre o menor preço "a partir de" vigente de cada empreendimento.</p></div>
      <div class="section"><div class="section-title">Todas as coletas</div><div data-tbl></div></div>
      <div class="section"><div class="section-title">Campanhas com desconto ou condições especiais</div><div data-camp></div></div>`;
    el.querySelector('[data-g]').addEventListener('change', e => { PriceState.group = e.target.value; PriceState.dev = ''; render(); });
    el.querySelector('[data-d]').addEventListener('change', e => { PriceState.dev = e.target.value; render(); });
    el.querySelector('[data-new]').addEventListener('click', () => UI.openForm('prices', null, { defaults: { developmentId: PriceState.dev || null, collectedAt: U.today(), priceType: 'a_partir_de' }, onSaved: render }));
    // Evolução mensal
    const pal = UI.palette(); const months = [...new Set(prices.map(p => String(p.collectedAt).slice(0, 7)))].sort();
    UI.chart(el.querySelector('[data-ev]'), {
      type: 'line',
      data: { labels: months.map(U.ym), datasets: series.map((s, i) => { const byM = {}; s.forEach(p => { byM[String(p.collectedAt).slice(0, 7)] = p.value; }); return { label: `${Schemas.devName(s[0].developmentId)} · ${s[0].typologyLabel}`, data: months.map(m => byM[m] ?? null), borderColor: pal[i % pal.length], backgroundColor: pal[i % pal.length], spanGaps: true, tension: 0.2, pointRadius: 4 }; }) },
      options: { plugins: { legend: { display: series.length <= 6, position: 'bottom' }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${U.brl(c.raw)}` } } }, scales: { y: { ticks: { callback: v => U.brl(v) } } } }
    }, { isEmpty: !series.length });
    const ppmRows = A.latestPrices().filter(p => devIds.has(p.developmentId) && A.ppm2(p)).sort((a, b) => A.ppm2(a) - A.ppm2(b));
    UI.chart(el.querySelector('[data-ppm]'), {
      type: 'bar',
      data: { labels: ppmRows.map(p => `${Schemas.devName(p.developmentId)} · ${p.areaM2} m²`), datasets: [{ label: 'R$/m² (a partir de)', data: ppmRows.map(A.ppm2), backgroundColor: pal[1], borderRadius: 4 }] },
      options: { indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${U.brl(c.raw)}/m² · ${ENUMS.priceType[ppmRows[c.dataIndex].priceType]} ${U.brl(ppmRows[c.dataIndex].value)}` } } }, scales: { x: { ticks: { callback: v => U.brl(v) } }, y: { grid: { display: false } } } }
    }, { isEmpty: !ppmRows.length, emptyText: 'Nenhum preço vinculado a metragem específica. R$/m² não é calculado a partir de preços "a partir de" sem metragem.' });
    // Bairro / grupo
    const devsF = A.devs().filter(devFilter).filter(d => A.startingPrice(d));
    const nb = U.groupBy(devsF, d => (d.address && d.address.neighborhood) ? `Bairro: ${d.address.neighborhood}` : `Grupo: ${A.groupName(d)} (bairro não informado)`);
    UI.crudTable(el.querySelector('[data-nb]'), {
      rows: () => Object.entries(nb).map(([k, ds]) => { const v = ds.map(d => A.startingPrice(d).value); return { id: k, k, n: ds.length, min: Math.min(...v), med: U.median(v), max: Math.max(...v), names: ds.map(d => d.name).join(', ') }; }),
      csvName: 'precos-por-bairro',
      columns: [
        { label: 'Agrupamento', key: 'k' }, { label: 'Empreendimentos', key: 'n', num: true },
        { label: 'Menor', key: 'min', num: true, render: r => h(U.brl(r.min)) }, { label: 'Mediana', key: 'med', num: true, render: r => h(U.brl(r.med)) },
        { label: 'Maior', key: 'max', num: true, render: r => h(U.brl(r.max)) }, { label: 'Incluídos', key: 'names', render: r => `<span class="small muted">${h(r.names)}</span>` }
      ]
    });
    UI.crudTable(el.querySelector('[data-tbl]'), {
      store: 'prices', rows: () => Store.list('prices').filter(p => devIds.has(p.developmentId)), csvName: 'precos', defaultSort: 7, defaultDir: -1,
      defaults: () => ({ developmentId: PriceState.dev || null, collectedAt: U.today(), priceType: 'a_partir_de' }),
      filters: [{ label: 'Tipo', options: () => Object.entries(ENUMS.priceType), match: (p, v) => p.priceType === v }],
      columns: [
        { label: 'Empreendimento', text: p => Schemas.devName(p.developmentId), render: p => `<a href="#/ficha/${h(p.developmentId)}">${h(Schemas.devName(p.developmentId))}</a>` },
        { label: 'Tipologia', key: 'typologyLabel', render: p => `${h(p.typologyLabel)}${p.unit ? ` · un. ${h(p.unit)}` : ''}${p.isPromo ? ' <span class="badge warn">promo</span>' : ''}` },
        { label: 'Valor', num: true, key: 'value', render: p => h(U.brl(p.value)) },
        { label: 'Tipo', text: p => ENUMS.priceType[p.priceType], render: p => `<span class="badge">${h(ENUMS.priceType[p.priceType])}</span>` },
        { label: 'Metragem vinculada', num: true, key: 'areaM2', render: p => p.areaM2 ? h(U.area(p.areaM2)) : '<span class="na">não vinculada</span>' },
        { label: 'R$/m²', num: true, text: p => A.ppm2(p), sortVal: A.ppm2, render: p => A.ppm2(p) ? h(U.brl(A.ppm2(p))) : '<span class="na">—</span>' },
        { label: 'Var. vs anterior', num: true, text: p => { const pr = prevOf(p); return pr ? ((p.value - pr.value) / pr.value) * 100 : null; }, render: p => { const pr = prevOf(p); return pr ? UI.trend(((p.value - pr.value) / pr.value) * 100) : '<span class="xs subtle">1ª coleta</span>'; } },
        { label: 'Coleta', key: 'collectedAt', render: p => h(U.date(p.collectedAt)) },
        { label: 'Origem', text: p => (p.sourceIds || []).map(id => (Store.get('sources', id) || {}).title).join(', '), render: p => `${UI.prov(p.provenance)}${p.sourceUrl ? ' ' + U.link(p.sourceUrl, 'link') : ''}` }
      ], onChange: render
    });
    UI.crudTable(el.querySelector('[data-camp]'), {
      store: 'campaigns', rows: () => Store.list('campaigns').filter(c => devIds.has(c.developmentId)), csvName: 'campanhas', addLabel: 'Nova campanha',
      defaults: () => ({ developmentId: PriceState.dev || null, identifiedAt: U.today() }),
      emptyText: 'Nenhuma campanha registrada.',
      columns: [
        { label: 'Empreendimento', text: c => Schemas.devName(c.developmentId) },
        { label: 'Campanha', key: 'name' }, { label: 'Tipo', text: c => ENUMS.campaignKind[c.kind], render: c => U.show(ENUMS.campaignKind[c.kind]) },
        { label: 'Oferta', key: 'offer' }, { label: 'Período', text: c => `${U.date(c.startDate) || '?'} – ${U.date(c.endDate) || '?'}` },
        { label: 'Identificada em', key: 'identifiedAt', render: c => U.show(c.identifiedAt, U.date) }
      ], onChange: render
    });
  };
  render();
};

/* ======================= MÓDULO 5 — LOCALIZAÇÃO ======================= */
/**
 * Geocodificação via Nominatim (OpenStreetMap). Chamada real, sob demanda,
 * respeitando a política de uso (1 requisição por vez, sem lote automático).
 * O resultado NUNCA vira marcador preciso automaticamente: fica como
 * "pendente de validação" (ou "aproximado" quando falta o número) até que
 * um usuário confirme a posição no mapa.
 */
const Geo = {
  endpoint: 'https://nominatim.openstreetmap.org/search',
  async geocode(params) {
    const url = new URL(this.endpoint);
    Object.entries({ format: 'jsonv2', limit: '1', countrycodes: 'br', addressdetails: '1', ...params }).forEach(([k, v]) => v && url.searchParams.set(k, v));
    const res = await fetch(url.href, { headers: { 'Accept-Language': 'pt-BR' } });
    if (!res.ok) throw new Error(`Nominatim respondeu ${res.status}`);
    const data = await res.json(); return data[0] || null;
  },
  async devGeocode(d) {
    const a = d.address || {};
    if (d.addressStatus === 'nao_divulgado' || !a.street) throw new Error('Endereço não divulgado/incompleto: geocodificação bloqueada.');
    const r = await this.geocode({ street: `${a.number ? a.number + ' ' : ''}${a.street}`, city: a.city || 'São Paulo', state: a.uf || 'SP' });
    if (!r) throw new Error('Endereço não encontrado no OpenStreetMap.');
    const status = a.number ? 'geocodificado_pendente' : 'aproximado';
    return { lat: Number(r.lat), lng: Number(r.lon), status, source: 'Nominatim / OpenStreetMap', geocodedAt: U.nowIso(), displayName: r.display_name };
  },
  async stationGeocode(s) {
    const r = await this.geocode({ q: `Estação ${s.name}, São Paulo` });
    if (!r) throw new Error('Estação não encontrada.');
    return { lat: Number(r.lat), lng: Number(r.lon), status: 'geocodificado_pendente', source: 'Nominatim / OpenStreetMap', geocodedAt: U.nowIso(), displayName: r.display_name };
  }
};

Views.localizacao = (el) => {
  let map = null;
  const render = () => {
    if (map) { map.remove(); map = null; }
    const devs = A.devs(); const stations = Store.list('stations');
    const hasGeo = g => g && g.lat != null && g.lng != null;
    const placed = devs.filter(d => hasGeo(d.geo)); const validated = placed.filter(d => d.geo.status === 'validado');
    el.innerHTML = pageHead('Módulo 05', 'Inteligência de localização',
      'Endereços só se tornam marcadores precisos depois de geocodificados <b>e validados</b>. Distâncias até o metrô são as informadas pelas fontes (aproximadas). Nenhuma coordenada é inventada: o Ousy VM permanece sem localização exata até a divulgação oficial do endereço.') + `
      <div class="grid g-4">
        <div class="card kpi"><div class="kpi-label">Validados no mapa</div><div class="kpi-value">${validated.length}</div><div class="kpi-meta">de ${devs.length} empreendimentos</div></div>
        <div class="card kpi"><div class="kpi-label">Pendentes de validação</div><div class="kpi-value">${placed.length - validated.length}</div><div class="kpi-meta">geocodificados, posição não confirmada</div></div>
        <div class="card kpi"><div class="kpi-label">Sem coordenadas</div><div class="kpi-value">${devs.length - placed.length}</div><div class="kpi-meta">${devs.filter(d => d.addressStatus === 'nao_divulgado').length} com endereço não divulgado</div></div>
        <div class="card kpi"><div class="kpi-label">Distâncias numéricas</div><div class="kpi-value">${Store.list('proximities').filter(p => p.distanceM != null).length}</div><div class="kpi-meta">${Store.list('proximities').filter(p => p.distanceM == null).length} apenas textuais</div></div>
      </div>
      <div class="card section"><div class="row-between" style="margin-bottom:var(--space-3)"><div class="card-title">Mapa</div><span class="xs subtle">Mapa base © colaboradores do OpenStreetMap</span></div>
        <div class="map" id="map"></div>
        <div class="map-legend"><span><span class="legend-swatch" style="background:var(--brand-accent)"></span>Ousy (validado)</span><span><span class="legend-swatch" style="background:var(--chart-3)"></span>Concorrente (validado)</span><span><span class="legend-swatch" style="border:2px dashed var(--color-warning);background:transparent"></span>Pendente / aproximado (não preciso)</span><span><span class="legend-swatch" style="background:var(--chart-4);border-radius:2px"></span>Estação de metrô</span></div>
      </div>
      <div class="section"><div class="section-title">Geocodificação e validação</div>
        <div class="callout" style="margin-bottom:var(--space-3)">"Geocodificar" consulta o serviço público Nominatim (OpenStreetMap) e exige conexão. Confira a posição no mapa antes de clicar em "Validar". Endereços sem número ficam como <b>aproximados</b>.</div>
        <div data-geo></div></div>
      <div class="section"><div class="section-title">Estações de metrô</div><div data-st></div></div>
      <div class="grid g-2 section">
        <div class="card"><div class="card-title">Concentração de oferta</div><div class="card-sub">Concorrentes por grupo de referência e por bairro informado</div><div class="chart-box" data-conc></div></div>
        <div class="card"><div class="card-title">Comparação de distâncias até o metrô</div><div class="card-sub">Valores informados pelas fontes (≈). Itens sem número não aparecem.</div><div class="chart-box" data-dist></div></div>
      </div>
      <div class="section"><div class="section-title">Concorrentes próximos (linha reta)</div><div data-near></div></div>`;

    // Mapa
    const mapEl = el.querySelector('#map');
    if (!window.L) mapEl.innerHTML = '<div class="chart-empty">Biblioteca de mapas indisponível (sem conexão com a CDN).</div>';
    else {
      map = L.map(mapEl, { scrollWheelZoom: false }).setView([-23.5505, -46.6333], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
      const bounds = [];
      placed.forEach(d => {
        const valid = d.geo.status === 'validado'; const color = d.isOusy ? U.cssVar('--brand-accent') : U.cssVar('--chart-3');
        const m = valid
          ? L.circleMarker([d.geo.lat, d.geo.lng], { radius: d.isOusy ? 10 : 7, color, fillColor: color, fillOpacity: 0.9, weight: 2 })
          : L.circle([d.geo.lat, d.geo.lng], { radius: 120, color: U.cssVar('--color-warning'), dashArray: '4 4', fillOpacity: 0.08, weight: 2 });
        m.bindPopup(`<b>${h(d.name)}</b><br>${h(A.groupName(d))}<br>${h(ENUMS.geoStatus[d.geo.status])}<br><small>${h(d.geo.displayName || '')}</small><br><a href="#/ficha/${h(d.id)}">Abrir ficha</a>`);
        m.addTo(map); bounds.push([d.geo.lat, d.geo.lng]);
      });
      stations.filter(s => hasGeo(s.geo)).forEach(s => {
        const c = U.cssVar('--chart-4');
        L.circleMarker([s.geo.lat, s.geo.lng], { radius: 6, color: c, fillColor: c, fillOpacity: 1, weight: 1, dashArray: s.geo.status === 'validado' ? null : '2 2' })
          .bindPopup(`<b>Estação ${h(s.name)}</b><br>${h(s.lines || '')}<br>${h(ENUMS.geoStatus[s.geo.status] || '')}`).addTo(map);
        bounds.push([s.geo.lat, s.geo.lng]);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
      setTimeout(() => map && map.invalidateSize(), 50);
    }

    const geoActions = (store) => [
      { label: 'Geocodificar', icon: 'map', run: async (r, refresh) => {
        try {
          UI.toast('Consultando Nominatim…');
          const g = store === 'developments' ? await Geo.devGeocode(r) : await Geo.stationGeocode(r);
          await Store.update(store, r.id, { geo: { ...(r.geo || {}), ...g } }, { note: `Geocodificação automática: ${g.displayName}` });
          UI.toast(`Posição encontrada (${ENUMS.geoStatus[g.status]}). Confira no mapa e valide.`); render();
        } catch (e) { UI.toast(e.message, 'error'); }
      } },
      { label: 'Validar posição', icon: 'eye', run: async (r) => {
        if (!r.geo || r.geo.lat == null) return UI.toast('Sem coordenadas para validar.', 'error');
        const ok = await UI.confirm(`Confirmar que a posição de <b>${h(Schemas.title(store, r))}</b> (${r.geo.lat.toFixed(5)}, ${r.geo.lng.toFixed(5)}) foi conferida e é precisa?<br><span class="small muted">${h(r.geo.displayName || '')}</span>`, { okLabel: 'Validar', danger: false });
        if (!ok) return;
        await Store.update(store, r.id, { geo: { ...r.geo, status: 'validado', validatedAt: U.nowIso() } }, { note: 'Posição validada manualmente' }); render();
      } }
    ];
    UI.crudTable(el.querySelector('[data-geo]'), {
      store: 'developments', allowCreate: false, rows: () => A.devs(), csvName: 'geolocalizacao', extraActions: geoActions('developments'),
      rowClass: d => d.isOusy ? 'row-ousy' : '',
      columns: [
        { label: 'Empreendimento', key: 'name', render: d => `<a href="#/ficha/${h(d.id)}">${h(d.name)}</a>` },
        { label: 'Grupo', text: d => A.groupName(d) },
        { label: 'Endereço', text: d => A.addressText(d), render: d => `${U.show(A.addressText(d))} <span class="badge">${h(ENUMS.addressStatus[d.addressStatus] || '')}</span>` },
        { label: 'Status', text: d => ENUMS.geoStatus[(d.geo || {}).status], render: d => `<span class="badge ${(d.geo || {}).status === 'validado' ? 'pos' : ((d.geo || {}).lat != null ? 'warn' : '')}">${h(ENUMS.geoStatus[(d.geo || {}).status || 'nao_geocodificado'])}</span>` },
        { label: 'Coordenadas', text: d => (d.geo && d.geo.lat != null) ? `${d.geo.lat}, ${d.geo.lng}` : '', render: d => (d.geo && d.geo.lat != null) ? `<span class="mono">${d.geo.lat.toFixed(5)}, ${d.geo.lng.toFixed(5)}</span>` : U.NA }
      ],
      onEdit: d => openGeoForm('developments', d, render)
    });
    UI.crudTable(el.querySelector('[data-st]'), {
      store: 'stations', rows: () => Store.list('stations'), csvName: 'estacoes', extraActions: geoActions('stations'), addLabel: 'Nova estação',
      columns: [
        { label: 'Estação', key: 'name' }, { label: 'Linhas', key: 'lines' },
        { label: 'Empreendimentos vinculados', text: s => Store.list('proximities').filter(p => p.stationId === s.id).map(p => Schemas.devName(p.developmentId)).join(', '), render: s => `<span class="small">${h(Store.list('proximities').filter(p => p.stationId === s.id).map(p => Schemas.devName(p.developmentId)).join(', ') || '—')}</span>` },
        { label: 'Status', text: s => ENUMS.geoStatus[(s.geo || {}).status], render: s => `<span class="badge ${(s.geo || {}).status === 'validado' ? 'pos' : ''}">${h(ENUMS.geoStatus[(s.geo || {}).status || 'nao_geocodificado'])}</span>` },
        { label: 'Dado', render: s => UI.govBadges(s), sortable: false }
      ], onChange: render
    });
    // Concentração
    const comps = A.competitors(); const pal = UI.palette();
    const byGroup = A.ousy().map(o => A.competitors(o.id).length);
    const byNb = U.groupBy(comps.filter(d => d.address && d.address.neighborhood), d => d.address.neighborhood);
    UI.chart(el.querySelector('[data-conc]'), {
      type: 'bar',
      data: { labels: [...A.ousy().map(o => `Grupo ${o.name}`), ...Object.keys(byNb).map(n => `Bairro ${n}`)], datasets: [{ label: 'Concorrentes', data: [...byGroup, ...Object.values(byNb).map(a => a.length)], backgroundColor: [...A.ousy().map(() => pal[0]), ...Object.keys(byNb).map(() => pal[1])], borderRadius: 4 }] },
      options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { ticks: { precision: 0 } } } }
    }, { isEmpty: !comps.length });
    const dist = comps.map(d => ({ d, p: A.proximities(d.id).find(x => x.distanceM != null) })).filter(x => x.p).sort((a, b) => a.p.distanceM - b.p.distanceM);
    UI.chart(el.querySelector('[data-dist]'), {
      type: 'bar',
      data: { labels: dist.map(x => x.d.name), datasets: [{ label: 'm (aprox.)', data: dist.map(x => x.p.distanceM), backgroundColor: dist.map(x => pal[A.ousy().findIndex(o => o.id === x.d.ousyRefId) + 1] || pal[0]), borderRadius: 4 }] },
      options: { indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `≈ ${U.num(c.raw)} m · ${A.stationName(dist[c.dataIndex].p) || 'estação não especificada'}` } } }, scales: { y: { grid: { display: false } } } }
    }, { isEmpty: !dist.length });
    // Próximos
    const near = el.querySelector('[data-near]');
    const rows = A.ousy().flatMap(o => {
      if (!o.geo || o.geo.status !== 'validado') return [];
      return A.devs().filter(d => d.id !== o.id && d.geo && d.geo.status === 'validado').map(d => ({ id: `${o.id}-${d.id}`, o, d, m: U.haversine(o.geo, d.geo) }));
    });
    if (!rows.length) near.innerHTML = '<div class="callout neutral">Disponível quando o empreendimento Ousy e os concorrentes tiverem posições <b>validadas</b>. A distância calculada é em linha reta e não substitui a distância de caminhada informada pelas fontes.</div>';
    else UI.crudTable(near, {
      rows: () => rows, csvName: 'distancias-calculadas', defaultSort: 2,
      columns: [{ label: 'Ousy', text: r => r.o.name }, { label: 'Concorrente', text: r => r.d.name }, { label: 'Distância em linha reta', num: true, text: r => Math.round(r.m), sortVal: r => r.m, render: r => `${h(U.num(r.m))} m` }]
    });
  };
  render();
  return () => { if (map) map.remove(); };
};

function openGeoForm(store, rec, after) {
  const g = rec.geo || {};
  const m = UI.modal({
    title: `Coordenadas · ${Schemas.title(store, rec)}`, size: 'sm',
    body: `<div class="stack">
      ${store === 'developments' && rec.addressStatus === 'nao_divulgado' ? '<div class="callout warn">Endereço não divulgado. Não registre coordenadas sem fonte oficial.</div>' : ''}
      <div class="field"><label>Latitude</label><input class="input" type="number" step="any" data-lat value="${g.lat ?? ''}"></div>
      <div class="field"><label>Longitude</label><input class="input" type="number" step="any" data-lng value="${g.lng ?? ''}"></div>
      <div class="field"><label>Status</label><select class="input" data-st>${Object.entries(ENUMS.geoStatus).map(([k, l]) => `<option value="${k}" ${g.status === k ? 'selected' : ''}>${h(l)}</option>`).join('')}</select></div>
      <div class="field"><label>Fonte da coordenada</label><input class="input" data-src value="${h(g.source || '')}" placeholder="Ex.: memorial de incorporação, site oficial"></div></div>`,
    footer: `${store === 'developments' ? `<button class="btn" data-full>Editar ficha completa</button>` : ''}<button class="btn" data-clear>Limpar coordenadas</button><button class="btn btn-primary" data-save>Salvar</button>`
  });
  const q = s => m.el.querySelector(s);
  q('[data-full]')?.addEventListener('click', () => { m.close(); UI.openForm(store, rec, { onSaved: after }); });
  q('[data-clear]').addEventListener('click', async () => { await Store.update(store, rec.id, { geo: { lat: null, lng: null, status: 'nao_geocodificado', source: null, geocodedAt: null, displayName: null } }, { note: 'Coordenadas removidas' }); m.close(); after(); });
  q('[data-save]').addEventListener('click', async () => {
    const lat = q('[data-lat]').value === '' ? null : Number(q('[data-lat]').value), lng = q('[data-lng]').value === '' ? null : Number(q('[data-lng]').value);
    if ((lat == null) !== (lng == null) || (lat != null && (Math.abs(lat) > 90 || Math.abs(lng) > 180))) return UI.toast('Coordenadas inválidas.', 'error');
    if (lat != null && !q('[data-src]').value.trim()) return UI.toast('Informe a fonte da coordenada.', 'error');
    await Store.update(store, rec.id, { geo: { ...g, lat, lng, status: lat == null ? 'nao_geocodificado' : q('[data-st]').value, source: q('[data-src]').value.trim() || null } }, { note: 'Coordenadas editadas manualmente' });
    m.close(); after();
  });
}

    const la = Object.values(latestByDev);
    const triCell = v => v === 'sim' ? '<td class="yes">✓</td>' : v === 'nao' ? '<td class="no">✗</td>' : '<td class="unk">—</td>';

        <div class="row"><select class="input" style="width:auto" data-sf="theme"><option value="">Tema: todos</option>${Object.entries(ENUMS.postTheme).map(([k, l]) => `<option value="${k}" ${SocialState.theme === k ? 'selected' : ''}>${h(l)}</option>`).join('')}</select>
        <select class="input" style="width:auto" data-sf="network"><option value="">Rede: todas</option>${Object.entries(ENUMS.network).map(([k, l]) => `<option value="${k}" ${SocialState.network === k ? 'selected' : ''}>${h(l)}</option>`).join('')}</select>
        <select class="input" style="width:auto" data-sf="dev"><option value="">Empreendimento: todos</option>${A.devs().map(d => `<option value="${h(d.id)}" ${SocialState.dev === d.id ? 'selected' : ''}>${h(d.name)}</option>`).join('')}</select></div></div>
        ${posts.length ? `<div class="lib-grid">${posts.map(p => { const pr = Store.get('socialProfiles', p.profileId) || {}; return `

            <div class="small">${h((p.caption || '').slice(0, 180))}${(p.caption || '').length > 180 ? '…' : ''}</div>
            <div class="xs subtle" style="margin-top:auto">${[p.likes != null ? `${U.num(p.likes)} curtidas` : null, p.comments != null ? `${U.num(p.comments)} comentários` : null, p.views != null ? `${U.num(p.views)} visualizações` : null].filter(Boolean).join(' · ') || 'Engajamento não registrado'} ${p.url ? '· ' + U.link(p.url, 'original') : ''}</div>

    });

    el.querySelectorAll('.lib-card [data-del]').forEach(b => b.addEventListener('click', () => UI.deleteRecord('socialPosts', Store.get('socialPosts', b.dataset.del), render)));

    UI.chart(el.querySelector('[data-tr]'), {
      type: 'bar',
      data: { labels: themes.map(t => ENUMS.postTheme[t]), datasets: types.map((ty, i) => ({ label: ENUMS.postType[ty], data: themes.map(t => all.filter(p => p.theme === t && p.type === ty).length), backgroundColor: pal[i % pal.length], borderRadius: 2 })).filter(ds => ds.data.some(Boolean)) },
      options: { plugins: { legend: { position: 'bottom' } }, scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { precision: 0 } } } }
    }, { isEmpty: !all.length, emptyText: 'Registre publicações para visualizar tendências.' });
    const opp = el.querySelector('[data-opp]');
    if (compPosts.length < 10) opp.innerHTML = `<p class="small muted">Amostra insuficiente (${compPosts.length} publicações de concorrentes; mínimo sugerido: 10). Nenhuma hipótese gerada.</p>`;

      const cnt = U.groupBy(compPosts, p => p.theme); const total = compPosts.length;
      const low = themes.filter(t => t !== 'outros' && ((cnt[t] || []).length / total) < 0.05);
      const high = themes.filter(t => ((cnt[t] || []).length / total) >= 0.3);
      opp.innerHTML = `<ul class="list">
        ${low.map(t => `<li><span class="badge prov prov-hipotese">Hipótese</span> Tema <b>${h(ENUMS.postTheme[t])}</b> aparece em menos de 5% das publicações dos concorrentes — possível espaço de diferenciação a investigar.</li>`).join('')}
        ${high.map(t => `<li><span class="badge prov prov-hipotese">Hipótese</span> Tema <b>${h(ENUMS.postTheme[t])}</b> concentra ${Math.round((cnt[t].length / total) * 100)}% das publicações — território saturado; diferenciação pode exigir abordagem distinta.</li>`).join('')}
        ${!low.length && !high.length ? '<li class="muted">Distribuição de temas equilibrada; nenhuma hipótese destacada.</li>' : ''}</ul>
        <p class="xs subtle">Base: ${total} publicações de concorrentes. Confiança: ${total >= 50 ? 'média' : 'baixa'} — requer validação qualitativa.</p>`;

      store: 'socialProfiles', csvName: 'perfis-sociais', addLabel: 'Novo perfil', defaults: () => ({ network: 'instagram' }), emptyText: 'Nenhum perfil cadastrado.',
