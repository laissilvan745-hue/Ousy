        { label: 'Seguidores', num: true, key: 'followers', render: p => p.followers != null ? `${h(U.num(p.followers))} <span class="xs subtle">${h(U.date(p.followersAt) || '')}</span>` : U.NA },
        { label: 'Frequência', key: 'postingFrequency' }, { label: 'Tom de voz', key: 'tone' },
        { label: 'Publicações', num: true, text: p => all.filter(x => x.profileId === p.id).length }
      ], onChange: render
    });
  };
  render();
};

/* ======================= MÓDULO 9 — HISTÓRICO E ALERTAS ======================= */
const HistState = { from: '', to: '', entity: '', dev: '', q: '', limit: 150 };
const ALERT_ICONS = { price: ['price', 'R$'], delivery: ['delivery', '⌂'], stale: ['stale', '!'], ad: ['ad', '◆'], pending: ['pending', '?'] };

Views.historico = (el, params, query) => {
  if (query.dev) HistState.dev = query.dev;
  const render = () => {
    const alerts = A.alerts(); const pending = A.pendingVerification();
    const match = l => (!HistState.from || l.at.slice(0, 10) >= HistState.from) && (!HistState.to || l.at.slice(0, 10) <= HistState.to)
      && (!HistState.entity || l.entity === HistState.entity) && (!HistState.dev || l.developmentId === HistState.dev)
      && (!HistState.q || U.norm([l.entityTitle, l.fieldLabel, JSON.stringify(l.oldValue), JSON.stringify(l.newValue), l.note, l.user].join(' ')).includes(U.norm(HistState.q)));
    const logs = Store.list('changeLog').filter(match).sort((a, b) => b.at.localeCompare(a.at));
    const dismissedCount = Store.list('alertStates').filter(s => s.status === 'dismissed').length;
    el.innerHTML = pageHead('Módulo 09', 'Histórico, atualizações e alertas',
      'Toda alteração de dado é registrada automaticamente com valor anterior, novo valor, data, responsável, fonte e observação. Os alertas são calculados a partir dos dados armazenados.',
      `<button class="btn" data-csv>${icon('download')} Exportar histórico (CSV)</button>`) + `
      <div class="grid g-2">
        <div class="card"><div class="card-head"><div><div class="card-title">Alertas ativos (${alerts.length})</div><div class="card-sub">Preço · entrega próxima (${CONFIG.deliverySoonDays} dias) · dados sem verificação há +${CONFIG.staleDays} dias · novos anúncios/campanhas (${CONFIG.recentDays} dias)</div></div>${dismissedCount ? `<button class="btn btn-sm" data-restore>Restaurar ${dismissedCount} dispensado(s)</button>` : ''}</div>
          <div style="max-height:460px;overflow:auto">${alerts.map(a => `<div class="alert-item"><div class="alert-ico ${ALERT_ICONS[a.type][0]}">${ALERT_ICONS[a.type][1]}</div><div style="flex:1;min-width:0"><div><b>${a.devId ? `<a href="#/ficha/${h(a.devId)}">${h(a.title)}</a>` : h(a.title)}</b></div><div class="small muted">${h(a.detail)}</div></div><button class="btn btn-ghost btn-sm" data-dismiss="${h(a.key)}" title="Dispensar alerta">✕</button></div>`).join('') || '<p class="small muted">Nenhum alerta ativo.</p>'}</div></div>
        <div class="card"><div class="card-head"><div><div class="card-title">Pendências de verificação (${pending.length})</div><div class="card-sub">Registros pendentes ou divergentes — inclui toda a base inicial do briefing</div></div></div>
          <div style="max-height:460px;overflow:auto"><table class="data"><thead><tr><th>Registro</th><th>Tipo</th><th>Status</th><th></th></tr></thead><tbody>
          ${pending.slice(0, 200).map(({ store, rec }) => `<tr><td>${h(Schemas.title(store, rec))}</td><td class="small">${h(STORE_LABELS[store] || store)}</td><td>${UI.govBadges(rec)}</td><td class="actions"><button class="btn btn-sm" data-check="${h(store)}|${h(rec.id)}">Revisar</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">Nenhuma pendência.</td></tr>'}
          </tbody></table></div></div>
      </div>
      <div class="section"><div class="section-title">Linha do tempo das alterações</div>
        <div class="card no-print" style="margin-bottom:var(--space-4)"><div class="row">
          <label class="small">De <input class="input" type="date" style="width:auto;display:inline-block" data-h="from" value="${h(HistState.from)}"></label>
          <label class="small">Até <input class="input" type="date" style="width:auto;display:inline-block" data-h="to" value="${h(HistState.to)}"></label>
          <select class="input" style="width:auto" data-h="entity"><option value="">Entidade: todas</option>${Object.entries(STORE_LABELS).map(([k, l]) => `<option value="${k}" ${HistState.entity === k ? 'selected' : ''}>${h(l)}</option>`).join('')}</select>
          <select class="input" style="width:auto" data-h="dev"><option value="">Empreendimento: todos</option>${A.devs().map(d => `<option value="${h(d.id)}" ${HistState.dev === d.id ? 'selected' : ''}>${h(d.name)}</option>`).join('')}</select>
          <input class="input" style="width:200px" type="search" placeholder="Buscar no histórico…" data-h="q" value="${h(HistState.q)}">
          <button class="btn btn-sm" data-clear>Limpar filtros</button>
        </div></div>
        <div class="card"><p class="small muted" style="margin-bottom:var(--space-4)">${logs.length} alteração(ões) encontrada(s)</p>
          ${logs.length ? `<ul class="timeline">${logs.slice(0, HistState.limit).map(logItem).join('')}</ul>${logs.length > HistState.limit ? '<button class="btn" data-more>Mostrar mais</button>' : ''}` : '<p class="muted small">Nenhuma alteração no período.</p>'}</div></div>
      <div class="callout future section"><b>Integrações futuras:</b> notificações externas (e-mail, Slack, WhatsApp) e coletas agendadas dependem do backend (Supabase Edge Functions + agendador). Nesta versão os alertas são calculados no navegador sempre que a página é aberta.</div>`;
    el.querySelectorAll('[data-h]').forEach(i => i.addEventListener(i.type === 'search' ? 'input' : 'change', U.debounce(() => { HistState[i.dataset.h] = i.value; HistState.limit = 150; render(); }, 300)));
    el.querySelector('[data-clear]').addEventListener('click', () => { Object.assign(HistState, { from: '', to: '', entity: '', dev: '', q: '' }); if (location.hash.includes('?')) location.hash = '#/historico'; else render(); });
    el.querySelector('[data-more]')?.addEventListener('click', () => { HistState.limit += 150; render(); });
    el.querySelectorAll('[data-dismiss]').forEach(b => b.addEventListener('click', async () => { await Store.create('alertStates', { id: b.dataset.dismiss, status: 'dismissed', at: U.nowIso() }); render(); }));
    el.querySelector('[data-restore]')?.addEventListener('click', async () => { for (const s of [...Store.list('alertStates')]) await Store.remove('alertStates', s.id); render(); });
    el.querySelectorAll('[data-check]').forEach(b => b.addEventListener('click', () => { const [s, id] = b.dataset.check.split('|'); UI.openForm(s, Store.get(s, id), { onSaved: render, title: `Revisar ${STORE_LABELS[s] ? STORE_LABELS[s].toLowerCase() : 'registro'}` }); }));
    el.querySelector('[data-csv]').addEventListener('click', () => {
      const rows = logs.map(l => ({ data: l.at, entidade: STORE_LABELS[l.entity] || l.entity, registro: l.entityTitle, empreendimento: l.developmentId ? Schemas.devName(l.developmentId) : '', campo: l.fieldLabel || l.field, valor_anterior: Schemas.display(l.entity, l.field, l.oldValue), novo_valor: Schemas.display(l.entity, l.field, l.newValue), responsavel: l.user || '', fonte: l.sourceId ? (Store.get('sources', l.sourceId) || {}).title : '', observacao: l.note || '' }));
      U.download(`historico-${U.today()}.csv`, U.toCSV(rows, ['data', 'entidade', 'registro', 'empreendimento', 'campo', 'valor_anterior', 'novo_valor', 'responsavel', 'fonte', 'observacao']), 'text/csv;charset=utf-8');
    });
  };
  render();
};

/* ======================= MÓDULO 10 — RELATÓRIOS ======================= */
/**
 * Gerador de relatórios baseado em regras. Cada bloco é classificado como:
 *  fact   — fato extraído dos registros (com contagem e data de referência)
 *  interp — interpretação derivada dos fatos
 *  hyp    — hipótese para investigação (nunca recomendação conclusiva)
 *  gap    — lacuna de dados que impede a análise
 */
const Reports = {
  CATEGORIES: { completo: 'Completo', posicionamento: 'Posicionamento', precos: 'Preços e ofertas', entregas: 'Entregas', comunicacao: 'Comunicação e mídia', mudancas: 'Mudanças no período' },
  confidence(recs) {
    if (!recs.length) return 'Baixa';
    const v = recs.filter(r => r.verification === 'verificado').length / recs.length;
    if (v >= 0.7) return 'Alta'; if (v >= 0.3) return 'Média';
    return 'Baixa — base majoritariamente do briefing, pendente de validação';
  },
  build({ scope = 'all', from, to, category = 'completo' }) {
    const groups = scope === 'all' ? A.ousy() : A.ousy().filter(o => o.id === scope);
    const comps = groups.flatMap(g => A.competitors(g.id));
    const devIds = new Set([...groups, ...comps].map(d => d.id));
    const ref = referenceInfo(); const want = c => category === 'completo' || c.includes(category);
    const sections = [];
    const B = (kind, items, confidence) => ({ kind, items: items.filter(Boolean), confidence });

    if (want(['posicionamento'])) groups.forEach(o => {
      const cs = A.competitors(o.id); const ps = cs.map(d => ({ d, p: A.startingPrice(d) })).filter(x => x.p);
      const overlapArea = cs.filter(d => d.areaMin != null && o.areaMin != null && !(d.areaMin > (o.areaMax ?? Infinity) || o.areaMin > (d.areaMax ?? Infinity)));
      const ok = A.typologyKinds(o); const typOverlap = cs.filter(d => [...A.typologyKinds(d)].some(k => ok.has(k)));
      const minAreas = cs.filter(d => d.areaMin != null).map(d => d.areaMin);
      const withDist = cs.map(d => A.proximities(d.id).find(p => p.distanceM != null)).filter(Boolean);
      const exclusive = [...ok].filter(k => !cs.some(d => A.typologyKinds(d).has(k)));
      const facts = [
        `${o.name}: tipologias ${o.typologiesText || 'não informadas'}; metragem ${A.areaText(o) || 'não informada'}; preço ${A.startingPrice(o) ? U.brl(A.startingPrice(o).value) : 'não informado'}; entrega ${A.deliveryText(o) || 'não informada'}.`,
        `${cs.length} concorrentes associados; ${ps.length} com preço "a partir de" divulgado${ps.length ? `, entre ${U.brl(Math.min(...ps.map(x => x.p.value)))} e ${U.brl(Math.max(...ps.map(x => x.p.value)))}` : ''}.`,
        o.areaMin != null ? `${overlapArea.length} de ${cs.length} concorrentes têm faixa de metragem sobreposta à do ${o.name}${overlapArea.length ? ` (${overlapArea.map(d => d.name).join(', ')})` : ''}.` : null,
        ok.size ? `${typOverlap.length} de ${cs.length} concorrentes oferecem ao menos uma tipologia em comum.` : null,
        withDist.length ? `${withDist.length} de ${cs.length} concorrentes informam distância numérica até o metrô (de ≈${U.num(Math.min(...withDist.map(p => p.distanceM)))} m a ≈${U.num(Math.max(...withDist.map(p => p.distanceM)))} m).` : null
      ];
      const interps = [];
      if (o.areaMin != null && minAreas.length && o.areaMin < Math.min(...minAreas)) interps.push(`A metragem mínima do ${o.name} (${U.area(o.areaMin)}) é menor que a de todos os concorrentes com metragem informada (menor: ${U.area(Math.min(...minAreas))}). Isso pode indicar tíquete de entrada mais baixo, o que só se confirma com preço.`);
      else if (o.areaMin != null && minAreas.length && o.areaMin <= Math.min(...minAreas)) interps.push(`A metragem mínima do ${o.name} (${U.area(o.areaMin)}) está no mesmo patamar da menor metragem do grupo.`);
      if (overlapArea.length && cs.length && overlapArea.length / cs.length >= 0.6) interps.push(`A maior parte dos concorrentes (${overlapArea.length}/${cs.length}) disputa a mesma faixa de metragem — concorrência direta de produto.`);
      const hyps = exclusive.length ? [`Tipologia(s) ${[...exclusive].map(k => ENUMS.typologyKind[k]).join(', ')} não aparece(m) entre os concorrentes registrados: possível diferencial de produto a investigar (depende de demanda local).`] : [];
      const gaps = [!A.startingPrice(o) ? `Preço do ${o.name} não informado: o posicionamento por preço não pode ser avaliado.` : null,
        cs.length - ps.length ? `${cs.length - ps.length} concorrente(s) sem preço registrado: ${cs.filter(d => !A.startingPrice(d)).map(d => d.name).join(', ')}.` : null];
      sections.push({ title: `Como está o posicionamento do ${o.name} diante dos seus concorrentes?`, blocks: [B('fact', facts, Reports.confidence([o, ...cs])), B('interp', interps, 'Média'), B('hyp', hyps, 'Baixa'), B('gap', gaps)] });
    });

    if (want(['precos'])) {
      const ps = comps.map(d => ({ d, p: A.startingPrice(d) })).filter(x => x.p).sort((a, b) => a.p.value - b.p.value);
      sections.push({ title: 'Quais incorporadoras apresentam os menores preços anunciados?', blocks: [
        B('fact', ps.slice(0, 8).map(x => `${A.companiesText(x.d) || 'Incorporadora não informada'} — ${x.d.name}: ${ENUMS.priceType[x.p.priceType].toLowerCase()} ${U.brl(x.p.value)} (${x.p.typologyLabel}; coleta ${U.date(x.p.collectedAt)}).`), Reports.confidence(ps.map(x => x.p))),
        B('interp', ps.length ? ['Valores "a partir de" referem-se à unidade de entrada de cada produto. Comparações só são diretas entre produtos com metragem e tipologia equivalentes.'] : [], 'Alta'),
        B('gap', [comps.length - ps.length ? `${comps.length - ps.length} de ${comps.length} concorrentes sem preço registrado.` : null, 'Preços anunciados não refletem preço negociado, descontos individuais ou condições de pagamento.'])
      ] });
      const texts = [
        ...Store.list('prices').filter(p => devIds.has(p.developmentId)).map(p => [p.developmentId, p.conditions]),
        ...Store.list('campaigns').filter(c => devIds.has(c.developmentId)).map(c => [c.developmentId, c.offer]),
        ...Store.list('ads').filter(a => devIds.has(a.developmentId)).map(a => [a.developmentId, a.offer]),
        ...comps.map(d => [d.id, [d.commercialConditions, d.housingProgram].filter(Boolean).join(' ')])
      ].filter(([, t]) => t);
      const PAT = { 'Minha Casa Minha Vida': /minha casa|mcmv/i, 'Entrada facilitada/parcelada': /entrada/i, 'Desconto': /desconto|% ?off|\boff\b/i, 'Parcelamento': /parcela|mensa/i, 'ITBI/registro/documentação': /itbi|registro|documenta/i, 'Bônus/brinde': /b[ôo]nus|brinde/i };
      const found = Object.entries(PAT).map(([k, re]) => [k, [...new Set(texts.filter(([, t]) => re.test(t)).map(([id]) => Schemas.devName(id)))]]).filter(([, ds]) => ds.length);
      sections.push({ title: 'Quais ofertas comerciais se repetem?', blocks: [
        B('fact', found.map(([k, ds]) => `${k}: ${ds.length} empreendimento(s) — ${ds.join(', ')}.`), 'Média'),
        B('interp', found.filter(([, ds]) => ds.length >= 2).map(([k]) => `"${k}" aparece em mais de um concorrente — condição recorrente no mercado monitorado.`), 'Média'),
        B('gap', [texts.length < 3 ? `Apenas ${texts.length} registro(s) de condições/ofertas. Registre campanhas e anúncios para uma leitura confiável.` : null])
      ] });
    }

    if (want(['entregas'])) {
      const fut = comps.filter(d => d.deliveryForecast && !d.deliveryActual).sort((a, b) => U.ymToDate(a.deliveryForecast) - U.ymToDate(b.deliveryForecast));
      const done = comps.filter(d => d.deliveryActual || ['pronto', 'entregue'].includes(d.stage));
      sections.push({ title: 'Quais concorrentes têm entrega mais próxima?', blocks: [
        B('fact', [...done.map(d => `${d.name}: ${ENUMS.stage[d.stage]}${d.deliveryActual ? ` (entrega informada: ${U.ym(d.deliveryActual)})` : ''} — concorre com produto pronto.`), ...fut.slice(0, 6).map(d => `${d.name}: previsão ${U.ym(d.deliveryForecast)} (${A.monthsToDelivery(d)} meses).`)], Reports.confidence(comps)),
        B('interp', [done.length ? `${done.length} concorrente(s) já pronto(s)/entregue(s) disputam o comprador que busca imóvel para uso imediato.` : null, fut.length ? `A previsão mais próxima é ${fut[0].name} (${U.ym(fut[0].deliveryForecast)}).` : null], 'Média'),
        B('gap', [comps.filter(d => !A.delivery(d)).length ? `Sem data de entrega: ${comps.filter(d => !A.delivery(d)).map(d => d.name).join(', ')}.` : null, ...groups.filter(o => !A.delivery(o)).map(o => `Previsão de entrega do ${o.name} não informada — comparação de prazo indisponível.`)])
      ] });
    }

    if (want(['comunicacao'])) {
      const commRecs = ['ads', 'socialPosts', 'seoAudits'].flatMap(s => Store.list(s).filter(r => devIds.has(r.developmentId)));
      const metroComm = commRecs.filter(r => (r.argTags || []).includes('metro') || r.mentionsMetro === 'sim');
      const prox = Store.list('proximities').filter(p => devIds.has(p.developmentId) && !(Store.get('developments', p.developmentId) || {}).isOusy);
      sections.push({ title: 'Como os concorrentes comunicam a proximidade do metrô?', blocks: [
        B('fact', [`Distâncias informadas nas fontes: ${prox.filter(p => p.distanceM != null).length} numéricas e ${prox.filter(p => p.distanceM == null).length} apenas textuais (ex.: "${(prox.find(p => p.distanceM == null) || {}).text || '—'}").`,
          commRecs.length ? `${metroComm.length} de ${commRecs.length} peças/páginas registradas destacam o metrô.` : null], Reports.confidence(prox)),
        B('gap', [!commRecs.length ? 'Não há anúncios, publicações ou auditorias registrados para este escopo: a forma de comunicação do metrô não pode ser avaliada — apenas a distância informada.' : null])
      ] });
      const counts = A.argCounts([...devIds]); const top = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      sections.push({ title: 'Quais argumentos publicitários predominam?', blocks: [
        B('fact', top.slice(0, 6).map(([k, n]) => `${ENUMS.argTags[k] || k}: ${n} ocorrência(s) em ${commRecs.length} registro(s) de comunicação.`), 'Média'),
        B('interp', top.length ? [`Argumento mais recorrente: ${ENUMS.argTags[top[0][0]]}.`] : [], 'Média'),
        B('gap', [!top.length ? 'Nenhum argumento classificado. Marque os "Argumentos presentes" ao registrar anúncios, publicações e auditorias.' : null])
      ] });
    }

    if (want(['posicionamento'])) {
      const hyps = []; const commN = ['ads', 'socialPosts', 'seoAudits'].reduce((n, s) => n + Store.list(s).filter(r => devIds.has(r.developmentId)).length, 0);
      const noDist = comps.filter(d => !A.proximities(d.id).some(p => p.distanceM != null));
      if (noDist.length) hyps.push(`${noDist.length} de ${comps.length} concorrentes não divulgam distância numérica até o metrô. Informar distância exata e verificada (se favorável) pode reforçar credibilidade.`);
      const noPrice = comps.filter(d => !A.startingPrice(d));
      if (noPrice.length >= comps.length / 3) hyps.push(`${noPrice.length} concorrentes não têm preço público registrado. Transparência de preço pode ser explorada como diferencial — validar se a ausência é do mercado ou da coleta.`);
      if (commN >= 10) { const c = A.argCounts([...devIds]); const unused = Object.keys(ENUMS.argTags).filter(k => k !== 'outros' && !c[k]); if (unused.length) hyps.push(`Argumentos não utilizados nos registros de comunicação dos concorrentes: ${unused.map(k => ENUMS.argTags[k]).join(', ')}.`); }
      sections.push({ title: 'Que oportunidades de diferenciação podem ser investigadas pela Ousy?', blocks: [
        B('hyp', hyps, 'Baixa — hipóteses para investigação, não recomendações'),
        B('gap', [commN < 10 ? `Base de comunicação insuficiente (${commN} registros) para hipóteses sobre argumentos de mídia.` : null])
      ] });
    }

    if (want(['mudancas'])) {
      const logs = Store.list('changeLog').filter(l => (!from || l.at.slice(0, 10) >= from) && (!to || l.at.slice(0, 10) <= to) && (!l.developmentId || devIds.has(l.developmentId)) && !l.field.startsWith('(carga'));
      const pc = A.priceChanges().filter(c => devIds.has(c.dev.id) && (!from || c.curr.collectedAt >= from) && (!to || c.curr.collectedAt <= to));
      const byEnt = U.groupBy(logs, l => STORE_LABELS[l.entity] || l.entity);
      sections.push({ title: `O que mudou ${from ? `desde ${U.date(from)}` : 'desde o último levantamento'}?`, blocks: [
        B('fact', [logs.length ? `${logs.length} alteração(ões) registrada(s): ${Object.entries(byEnt).map(([k, v]) => `${k} (${v.length})`).join(', ')}.` : null,
          ...pc.map(c => `${c.dev.name} · ${c.curr.typologyLabel}: ${U.brl(c.prev.value)} → ${U.brl(c.curr.value)} (${U.pct(c.pct)}).`),
          ...logs.filter(l => !l.field.startsWith('(')).slice(0, 15).map(l => `${U.date(l.at)} · ${l.entityTitle} · ${l.fieldLabel}: ${Schemas.display(l.entity, l.field, l.oldValue)} → ${Schemas.display(l.entity, l.field, l.newValue)}.`)], 'Alta (registro do sistema)'),
        B('gap', [!logs.length && !pc.length ? 'Nenhuma alteração registrada no período.' : null])
      ] });
    }
    return {
      title: `Relatório de inteligência — ${scope === 'all' ? 'Todos os empreendimentos Ousy' : groups[0].name}`,
      category: Reports.CATEGORIES[category], scope, from, to, generatedAt: U.nowIso(),
      reference: ref.date, recordCount: comps.length + groups.length, sections
    };
  },
  LABELS: { fact: 'Fatos', interp: 'Interpretações', hyp: 'Hipóteses', gap: 'Lacunas de dados' },
  toHTML(r) {
    return `<div class="report"><h2 class="page-title" style="font-size:var(--fs-2xl)">${h(r.title)}</h2>
      <p class="small muted">Categoria: ${h(r.category)} · Gerado em ${h(U.dateTime(r.generatedAt))} · Referência dos dados: ${h(U.date(r.reference) || '—')} · ${r.recordCount} empreendimentos no escopo${r.from || r.to ? ` · Período: ${h(U.date(r.from) || 'início')} a ${h(U.date(r.to) || 'hoje')}` : ''}</p>
      <div class="callout neutral" style="margin-top:var(--space-3)">Relatório gerado automaticamente a partir dos dados cadastrados. Fatos, interpretações e hipóteses estão separados; hipóteses exigem validação antes de qualquer decisão.</div>
      ${r.sections.map(s => `<h3>${h(s.title)}</h3>${s.blocks.filter(b => b.items.length).map(b => `<div class="report-block ${b.kind}"><div class="lbl">${Reports.LABELS[b.kind]}${b.confidence ? ` <span class="conf">· Confiança: ${h(b.confidence)}</span>` : ''}</div><ul>${b.items.map(i => `<li>${h(i)}</li>`).join('')}</ul></div>`).join('') || '<p class="small muted">Sem conteúdo para esta pergunta.</p>'}`).join('')}</div>`;
  },
  toMarkdown(r) {
    return [`# ${r.title}`, '', `Categoria: ${r.category} · Gerado em ${U.dateTime(r.generatedAt)} · Referência: ${U.date(r.reference) || '—'}`, '',
      ...r.sections.flatMap(s => [`## ${s.title}`, '', ...s.blocks.filter(b => b.items.length).flatMap(b => [`**${Reports.LABELS[b.kind]}**${b.confidence ? ` _(confiança: ${b.confidence})_` : ''}`, '', ...b.items.map(i => `- ${i}`), ''])])].join('\n');
  },
  toPDF(r) {
    const jsPDF = window.jspdf && window.jspdf.jsPDF;
    if (!jsPDF) { UI.toast('Biblioteca de PDF indisponível. Usando impressão do navegador (salve como PDF).'); window.print(); return; }
    const doc = new jsPDF({ unit: 'pt', format: 'a4' }); const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(); const M = 48; let y = M;
    const ensure = n => { if (y + n > H - M) { doc.addPage(); y = M; } };
    const write = (text, { size = 10, bold = false, color = [30, 34, 40], gap = 4, indent = 0 } = {}) => {
      doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.setFontSize(size); doc.setTextColor(...color);
      doc.splitTextToSize(text, W - 2 * M - indent).forEach(line => { ensure(size + 4); doc.text(line, M + indent, y); y += size + 3; }); y += gap;
    };
    doc.setFillColor(21, 25, 31); doc.rect(0, 0, W, 6, 'F');
    write('OUSY Intelligence', { size: 9, color: [140, 106, 67] });
    write(r.title, { size: 16, bold: true, gap: 6 });
    write(`Categoria: ${r.category} · Gerado em ${U.dateTime(r.generatedAt)} · Referência dos dados: ${U.date(r.reference) || '—'}`, { size: 9, color: [95, 100, 109], gap: 10 });
    r.sections.forEach(s => {
      ensure(40); write(s.title, { size: 12, bold: true, gap: 4 });
      s.blocks.filter(b => b.items.length).forEach(b => {
        write(`${Reports.LABELS[b.kind].toUpperCase()}${b.confidence ? ` · Confiança: ${b.confidence}` : ''}`, { size: 8, bold: true, color: [95, 100, 109], gap: 2 });
        b.items.forEach(i => write(`• ${i}`, { size: 9.5, indent: 8, gap: 1 }));
        y += 6;
      });
      y += 6;
    });
    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(140); doc.text(`Página ${i} de ${pages} · Dados internos — uso gerencial`, M, H - 24); }
    doc.save(`relatorio-ousy-${U.slug(r.category)}-${U.today()}.pdf`);
  }
};
const ReportState = { scope: 'all', category: 'completo', from: '', to: '', current: null };

Views.relatorios = (el) => {
  if (!ReportState.from) { const d = new Date(); d.setDate(d.getDate() - 30); ReportState.from = d.toISOString().slice(0, 10); ReportState.to = U.today(); }
  const render = () => {

const CSV_STORES = ['developments', 'companies', 'stations', 'proximities', 'typologies', 'prices', 'campaigns', 'websites', 'seoAudits', 'ads', 'socialProfiles', 'socialPosts', 'sources', 'changeLog'];

/** Converte registro em linha CSV (chaves achatadas; arrays unidas com " | "). */
function recordToRow(r) { const f = U.flatten(r); Object.keys(f).forEach(k => { if (Array.isArray(f[k])) f[k] = f[k].join(' | '); }); return f; }
/** Converte linha CSV em registro, usando o esquema para tipar valores. */
function rowToRecord(store, row) {
  const schema = Schemas.get(store); const rec = {};
  Object.entries(row).forEach(([k, v]) => {
    const f = schema && schema.fields.find(x => x.key === k);
    let val = v === '' ? null : v;
    if (val !== null) {
      if ((f && f.type === 'number') || ['geo.lat', 'geo.lng', 'value', 'areaMin', 'areaMax', 'areaM2', 'units', 'distanceM', 'followers', 'likes', 'comments', 'views'].includes(k)) val = Number(String(val).replace(',', '.'));
      else if ((f && ['refmulti', 'tags', 'multiselect', 'files'].includes(f.type)) || ['sourceIds', 'companyIds', 'argTags', 'attachmentIds', 'formats', 'themes'].includes(k)) val = String(val).split(' | ').map(s => s.trim()).filter(Boolean);
      else if ((f && f.type === 'checkbox') || ['isOusy', 'isPromo'].includes(k)) val = ['true', 'sim', '1', 'verdadeiro'].includes(String(val).toLowerCase());
    } else if (['sourceIds', 'companyIds', 'argTags', 'attachmentIds'].includes(k)) val = [];
    U.set(rec, k, val);
  });
  return rec;
}

/* -----------------------------------------------------------------------
   11. ROTEADOR, BUSCA GLOBAL E INICIALIZAÇÃO
   ----------------------------------------------------------------------- */
const Router = {
  cleanup: null,
  parse() {
    const raw = location.hash.replace(/^#\/?/, ''); const [path, qs] = raw.split('?');
    const parts = (path || '').split('/').filter(Boolean).map(decodeURIComponent);
    return { name: parts[0] || 'inicio', params: parts.slice(1), query: Object.fromEntries(new URLSearchParams(qs || '')) };
  },
  render() {
    if (typeof Router.cleanup === 'function') { try { Router.cleanup(); } catch (e) { console.error(e); } }
    Router.cleanup = null; UI.destroyCharts(); document.getElementById('modal-root').innerHTML = '';
    const { name, params, query } = Router.parse(); const view = Views[name] || Views.inicio;
    const el = document.getElementById('view'); el.innerHTML = '';
    try { Router.cleanup = view(el, params, query); } catch (e) { console.error(e); el.innerHTML = `<div class="callout warn">Erro ao carregar o módulo: ${h(e.message)}</div>`; }
    const navName = name === 'ficha' ? 'empreendimentos' : name;
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.path === navName));
    const item = NAV.find(n => n.path === navName); document.title = `${item ? item.label + ' · ' : ''}OUSY Intelligence`;
    document.getElementById('app').classList.remove('nav-open'); window.scrollTo(0, 0);
    const ref = referenceInfo(); document.getElementById('ref-date').textContent = `Referência dos dados: ${U.date(ref.date) || '—'}`;
  }
};

function renderNav() {
  document.getElementById('nav').innerHTML = NAV.map(n => n.section
    ? `<div class="nav-section">${h(n.section)}</div>`
    : `<a href="#/${n.path}" data-path="${n.path}">${icon(n.icon, 'nav-ico')}<span>${h(n.label)}</span>${n.num ? `<span class="nav-num">${n.num}</span>` : ''}</a>`).join('');
  document.getElementById('sidebar-foot').innerHTML = `v${CONFIG.appVersion} · ${DB.memory ? 'memória temporária' : 'dados locais (IndexedDB)'}`;
}

function setupSearch() {
  const input = document.getElementById('global-search'); const box = document.getElementById('search-results'); let idx = -1;
  const run = () => {
    const q = U.norm(input.value.trim()); idx = -1;
    if (q.length < 2) { box.classList.add('hidden'); return; }
    const has = (...xs) => U.norm(xs.filter(Boolean).join(' ')).includes(q);
    const groups = [
      ['Empreendimentos', A.devs().filter(d => has(d.name, A.companiesText(d), A.addressText(d), d.typologiesText, d.addressReference)).map(d => [`#/ficha/${d.id}`, d.name, `${A.groupName(d)} · ${A.companiesText(d) || ''}`])],
      ['Incorporadoras', Store.list('companies').filter(c => has(c.name)).map(c => { const ds = A.devs().filter(d => (d.companyIds || []).includes(c.id)); return [ds[0] ? `#/ficha/${ds[0].id}` : '#/empreendimentos/__all', c.name, ds.map(d => d.name).join(', ')]; })],
      ['Anúncios', Store.list('ads').filter(a => has(a.headline, a.advertiser, a.offer, a.primaryText)).map(a => ['#/anuncios', a.headline || a.advertiser, Schemas.devName(a.developmentId)])],
      ['Publicações', Store.list('socialPosts').filter(p => has(p.caption, p.notes)).map(p => ['#/social', (p.caption || '').slice(0, 60), Schemas.devName(p.developmentId)])],
      ['Sites e auditorias', [...Store.list('websites'), ...Store.list('seoAudits')].filter(s => has(s.url, s.titleTag, s.h1)).map(s => ['#/seo', s.url, Schemas.devName(s.developmentId)])],
      ['Fontes', Store.list('sources').filter(s => has(s.title, s.url, s.notes)).map(s => ['#/fontes', s.title, ENUMS.sourceType[s.type]])]
    ].filter(([, xs]) => xs.length);
    box.innerHTML = groups.length ? groups.map(([g, xs]) => `<div class="grp">${h(g)}</div>${xs.slice(0, 6).map(([href, t, sub]) => `<a href="${h(href)}" role="option">${h(t)}<div class="xs subtle">${h(sub || '')}</div></a>`).join('')}`).join('') : '<div class="small muted" style="padding:8px 12px">Nenhum resultado.</div>';
    box.classList.remove('hidden');
  };
  input.addEventListener('input', U.debounce(run, 120));
  input.addEventListener('focus', run);
  input.addEventListener('keydown', e => {
    const links = [...box.querySelectorAll('a')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, Math.min(links.length - 1, idx + (e.key === 'ArrowDown' ? 1 : -1))); links.forEach((a, i) => a.classList.toggle('kbd', i === idx)); }
    else if (e.key === 'Enter' && links.length) { location.hash = (links[idx] || links[0]).getAttribute('href'); box.classList.add('hidden'); input.blur(); }
    else if (e.key === 'Escape') { box.classList.add('hidden'); input.blur(); }
  });
  box.addEventListener('click', e => { if (e.target.closest('a')) { box.classList.add('hidden'); input.value = ''; } });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) box.classList.add('hidden'); });
  document.addEventListener('keydown', e => { if (e.key === '/' && !e.target.closest('input, textarea, select')) { e.preventDefault(); input.focus(); } });
}

function applyTheme() {
  const t = Store.setting('theme', null);
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
}

async function boot() {
  await DB.open();
  await Store.load();
  await Seed.ensure();
  applyTheme(); renderNav(); setupSearch();
  document.getElementById('menu-btn').addEventListener('click', () => document.getElementById('app').classList.toggle('nav-open'));
  document.getElementById('app').addEventListener('click', e => { if (e.target.id === 'app') e.currentTarget.classList.remove('nav-open'); });
  document.getElementById('theme-btn').addEventListener('click', async () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    await Store.saveSetting('theme', cur === 'dark' ? 'light' : 'dark'); applyTheme(); Router.render();
  });
  window.addEventListener('hashchange', Router.render);
  if (DB.memory) UI.toast('IndexedDB indisponível: os dados não serão mantidos ao fechar a página. Exporte um backup.', 'error');
  Router.render();
}
// Scripts externos usam "defer" e executam antes de DOMContentLoaded.
document.addEventListener('DOMContentLoaded', boot);
</script>
